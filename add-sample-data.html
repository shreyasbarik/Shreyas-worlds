<!DOCTYPE html>
<html>
<head>
    <title>Add Sample Data</title>
</head>
<body>
    <h1>Adding Sample Comments...</h1>
    <div id="status">Processing...</div>

    <script type="module">
        import { db, collection, addDoc, serverTimestamp } from './firebase-config.js';

        const sampleComments = [
            {
                text: "The page is not reloading after I submit the form. I have to manually refresh the browser every time.",
                author: "John Smith",
                authorEmail: "john@example.com",
                authorUID: "sample1"
            },
            {
                text: "Website loading speed is very slow. It takes almost 10 seconds to load the homepage.",
                author: "Sarah Johnson",
                authorEmail: "sarah@example.com",
                authorUID: "sample2"
            },
            {
                text: "The search functionality is not working properly. When I search for products, it shows no results.",
                author: "Mike Davis",
                authorEmail: "mike@example.com",
                authorUID: "sample3"
            },
            {
                text: "Login button is not responding on mobile devices. Works fine on desktop though.",
                author: "Emma Wilson",
                authorEmail: "emma@example.com",
                authorUID: "sample4"
            },
            {
                text: "I'm getting 404 error when trying to access my account settings page.",
                author: "David Brown",
                authorEmail: "david@example.com",
                authorUID: "sample5"
            },
            {
                text: "Images are not loading on the product pages. Just showing broken image icons.",
                author: "Lisa Anderson",
                authorEmail: "lisa@example.com",
                authorUID: "sample6"
            },
            {
                text: "The checkout process keeps crashing at the payment step. Very frustrating!",
                author: "Robert Taylor",
                authorEmail: "robert@example.com",
                authorUID: "sample7"
            }
        ];

        async function addSampleData() {
            try {
                for (const comment of sampleComments) {
                    await addDoc(collection(db, 'communityComments'), {
                        ...comment,
                        timestamp: serverTimestamp(),
                        highlighted: false,
                        adminReply: null
                    });
                }
                document.getElementById('status').innerHTML = '<h2 style="color: green;">✓ Sample comments added successfully!</h2><p>You can now close this page and go to ask.html or helpline.html</p>';
            } catch (error) {
                document.getElementById('status').innerHTML = '<h2 style="color: red;">Error: ' + error.message + '</h2>';
            }
        }

        addSampleData();
    </script>
</body>
</html>
