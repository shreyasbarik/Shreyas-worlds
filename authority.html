<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Authority Login | Sharvika</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet" href="authority.css"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bcrypt.js/2.4.3/bcrypt.min.js"></script>
</head>
<body>
  <div id="scene">
    <!-- Animated Character -->
    <div class="character" id="character">
      <svg width="108" height="220" viewBox="0 0 108 220"><!-- Stylized character -->
        <ellipse cx="54" cy="38" rx="28" ry="32" fill="#dabefe"/>
        <rect x="42" y="60" width="24" height="70" rx="11" fill="#6b4cf5"/>
        <rect x="27" y="120" width="18" height="55" rx="8" fill="#ffd776"/>
        <rect x="63" y="120" width="18" height="55" rx="8" fill="#ffd776"/>
        <ellipse cx="54" cy="200" rx="14" ry="7" fill="#f2dfff"/>
        <!-- Bag -->
        <g id="bag">
          <rect x="30" y="85" width="48" height="28" rx="12" fill="#ffda7c" stroke="#bb983c" stroke-width="2"/>
          <rect x="40" y="82" width="28" height="8" rx="4" fill="#856b3c"/>
        </g>
      </svg>
    </div>
    <!-- Glassmorphism Login Form -->
    <div id="login-card" class="login-card animate-in">
      <h2><span>Authority Login</span></h2>
      <form id="loginForm" autocomplete="off">
        <input type="text" name="username" placeholder="Username" required autocomplete="off" />
        <input type="password" name="password" placeholder="Password" required autocomplete="off" />
        <button type="submit"><span>Login</span></button>
        <div id="auth-status"></div>
      </form>
    </div>
  </div>
  <script src="authority.js"></script>
  <script>
    // Animation logic: Character walks in, drops bag, login card appears, character poses
    window.onload = function() {
      setTimeout(() => {
        document.getElementById("character").classList.add("walk-in");
      }, 500);
      setTimeout(() => {
        document.getElementById("character").classList.add("drop-bag");
      }, 1700);
      setTimeout(() => {
        document.getElementById("login-card").classList.add("show-card");
        document.getElementById("character").classList.add("pose");
      }, 2500);
    };
  </script>
</body>
</html>
