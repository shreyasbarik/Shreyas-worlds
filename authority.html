<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sharvika - Authority Access Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #2563eb;
            --primary-dark: #1e40af;
            --primary-light: #3b82f6;
            --secondary: #7c3aed;
            --accent: #06b6d4;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --dark: #0f172a;
            --dark-light: #1e293b;
            --dark-lighter: #334155;
            --text-primary: #f8fafc;
            --text-secondary: #cbd5e1;
            --text-muted: #64748b;
            --border: rgba(148, 163, 184, 0.1);
            --surface: rgba(255, 255, 255, 0.05);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--dark);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #334155 100%);
        }

        .grid-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(37, 99, 235, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(37, 99, 235, 0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            animation: gridScroll 30s linear infinite;
            z-index: 1;
        }

        @keyframes gridScroll {
            0% { transform: translate(0, 0); }
            100% { transform: translate(60px, 60px); }
        }

        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.3;
            animation: floatOrb 30s infinite ease-in-out;
            pointer-events: none;
            z-index: 2;
        }

        .orb-1 {
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(37, 99, 235, 0.4) 0%, transparent 70%);
            top: -15%;
            left: -10%;
        }

        .orb-2 {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(124, 58, 237, 0.4) 0%, transparent 70%);
            bottom: -10%;
            right: -5%;
            animation-delay: 10s;
        }

        .orb-3 {
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, rgba(6, 182, 212, 0.4) 0%, transparent 70%);
            top: 40%;
            right: 20%;
            animation-delay: 20s;
        }

        @keyframes floatOrb {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(80px, -80px) scale(1.1); }
            66% { transform: translate(-60px, 60px) scale(0.9); }
        }

        .login-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 520px;
            padding: 20px;
            animation: containerEntrance 1s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes containerEntrance {
            0% {
                opacity: 0;
                transform: translateY(60px) scale(0.9);
                filter: blur(20px);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
                filter: blur(0);
            }
        }

        .login-container {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(40px) saturate(180%);
            border: 1px solid rgba(148, 163, 184, 0.1);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 
                0 20px 60px rgba(0, 0, 0, 0.5),
                0 0 0 1px rgba(255, 255, 255, 0.05) inset;
            position: relative;
        }

        .login-header {
            background: linear-gradient(135deg, rgba(37, 99, 235, 0.05) 0%, rgba(124, 58, 237, 0.05) 100%);
            padding: 48px 40px 40px;
            text-align: center;
            border-bottom: 1px solid rgba(148, 163, 184, 0.1);
        }

        .logo-icon {
            width: 72px;
            height: 72px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 32px rgba(37, 99, 235, 0.3);
            animation: logoFloat 4s ease-in-out infinite;
        }

        @keyframes logoFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .logo-icon svg {
            width: 36px;
            height: 36px;
            fill: white;
        }

        .company-name {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 36px;
            font-weight: 700;
            background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
            margin-bottom: 16px;
        }

        .portal-badge {
            display: inline-block;
            padding: 10px 20px;
            background: rgba(37, 99, 235, 0.1);
            border: 1px solid rgba(37, 99, 235, 0.2);
            border-radius: 10px;
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .form-section {
            padding: 40px;
        }

        .form-title {
            color: var(--text-primary);
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 32px;
        }

        .input-group {
            margin-bottom: 24px;
        }

        .input-label {
            display: block;
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 10px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 16px;
            transition: all 0.3s ease;
            z-index: 2;
        }

        .input-field, .select-field {
            width: 100%;
            padding: 16px 18px 16px 50px;
            background: rgba(15, 23, 42, 0.5);
            border: 1.5px solid var(--border);
            border-radius: 12px;
            font-size: 15px;
            font-weight: 400;
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            outline: none;
        }

        .select-field {
            cursor: pointer;
            appearance: none;
            background-image: url("data:image/svg+xml,%3Csvg width='12' height='8' viewBox='0 0 12 8' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1.5L6 6.5L11 1.5' stroke='%2364748b' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E");
            background-repeat: no-repeat;
            background-position: right 18px center;
            background-color: rgba(15, 23, 42, 0.5);
        }

        .input-field::placeholder {
            color: var(--text-muted);
        }

        .input-field:focus, .select-field:focus {
            background: rgba(15, 23, 42, 0.8);
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
            transform: translateY(-2px);
        }

        .input-field:focus ~ .input-icon {
            color: var(--primary);
        }

        .toggle-password {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: var(--text-muted);
            font-size: 16px;
            transition: all 0.3s ease;
            z-index: 2;
            padding: 8px;
        }

        .toggle-password:hover {
            color: var(--primary);
        }

        .captcha-wrapper {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 12px;
            align-items: end;
        }

        .captcha-display {
            background: linear-gradient(135deg, rgba(37, 99, 235, 0.1) 0%, rgba(124, 58, 237, 0.1) 100%);
            border: 1.5px solid rgba(148, 163, 184, 0.2);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            user-select: none;
            position: relative;
            overflow: hidden;
        }

        .captcha-code {
            font-family: 'Courier New', monospace;
            font-size: 28px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: 8px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .refresh-captcha {
            width: 56px;
            height: 56px;
            background: rgba(37, 99, 235, 0.1);
            border: 1.5px solid rgba(37, 99, 235, 0.2);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary);
            font-size: 20px;
        }

        .refresh-captcha:hover {
            background: rgba(37, 99, 235, 0.2);
            transform: rotate(180deg);
        }

        .btn-submit {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            color: white;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            margin-top: 32px;
            box-shadow: 0 8px 24px rgba(37, 99, 235, 0.3);
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(37, 99, 235, 0.4);
        }

        .btn-text {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-submit .spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .btn-submit.loading .btn-text { display: none; }
        .btn-submit.loading .spinner { display: block; }

        .form-footer {
            padding: 32px 40px;
            border-top: 1px solid var(--border);
            text-align: center;
        }

        .copyright {
            color: var(--text-muted);
            font-size: 12px;
        }

        .toast {
            position: fixed;
            top: 30px;
            right: 30px;
            background: rgba(239, 68, 68, 0.95);
            backdrop-filter: blur(20px);
            color: white;
            padding: 20px 28px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(239, 68, 68, 0.4);
            display: flex;
            align-items: center;
            gap: 16px;
            transform: translateX(500px);
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 1000;
        }

        .toast.show {
            transform: translateX(0);
        }

        .toast.success {
            background: rgba(16, 185, 129, 0.95);
            box-shadow: 0 8px 32px rgba(16, 185, 129, 0.4);
        }

        .toast i {
            font-size: 24px;
        }

        .toast-content h4 {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .toast-content p {
            font-size: 13px;
            opacity: 0.95;
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        .loading-overlay.active {
            display: flex;
        }

        .loader {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(37, 99, 235, 0.2);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @media (max-width: 768px) {
            .login-wrapper { padding: 16px; }
            .login-header { padding: 40px 24px 32px; }
            .form-section { padding: 32px 24px; }
            .form-footer { padding: 24px; }
            .company-name { font-size: 28px; }
            .captcha-wrapper { grid-template-columns: 1fr; }
            .refresh-captcha { width: 100%; height: 48px; }
            .toast {
                top: 16px;
                right: 16px;
                left: 16px;
                transform: translateY(-200px);
            }
            .toast.show { transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="background"></div>
    <div class="grid-overlay"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <div class="loading-overlay" id="loadingOverlay">
        <div class="loader"></div>
    </div>

    <div class="toast" id="toast">
        <i class="fas fa-check-circle"></i>
        <div class="toast-content">
            <h4>Success</h4>
            <p>Message</p>
        </div>
    </div>

    <div class="login-wrapper">
        <div class="login-container">
            <div class="login-header">
                <div class="logo-icon">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/>
                    </svg>
                </div>
                <h1 class="company-name">SHARVIKA</h1>
                <div class="portal-badge">Authority Access Only</div>
            </div>

            <div class="form-section">
                <h2 class="form-title">Secure Authentication</h2>

                <form id="loginForm">
                    <div class="input-group">
                        <label class="input-label">Username</label>
                        <div class="input-wrapper">
                            <i class="fas fa-user input-icon"></i>
                            <input 
                                type="text" 
                                class="input-field" 
                                id="username" 
                                placeholder="Enter your username"
                                required
                            >
                        </div>
                    </div>

                    <div class="input-group">
                        <label class="input-label">Password</label>
                        <div class="input-wrapper">
                            <i class="fas fa-lock input-icon"></i>
                            <input 
                                type="password" 
                                class="input-field" 
                                id="password" 
                                placeholder="Enter your password"
                                required
                            >
                            <i class="fas fa-eye toggle-password" id="togglePassword"></i>
                        </div>
                    </div>

                    <div class="input-group">
                        <label class="input-label">Team Name</label>
                        <div class="input-wrapper">
                            <i class="fas fa-users input-icon"></i>
                            <select class="select-field" id="teamname" required>
                                <option value="">Select your team</option>
                                <option value="HELPLINE">HELPLINE</option>
                                <option value="TECHNICAL">TECHNICAL</option>
                                <option value="PUBLISHER">PUBLISHER</option>
                            </select>
                        </div>
                    </div>

                    <div class="input-group">
                        <label class="input-label">Position</label>
                        <div class="input-wrapper">
                            <i class="fas fa-id-badge input-icon"></i>
                            <select class="select-field" id="position" required>
                                <option value="">Select your position</option>
                                <option value="PROJECT_MANAGER">Project Manager</option>
                                <option value="HELPLINE_MANAGER">Helpline Manager</option>
                                <option value="TECHNICAL_MANAGER">Technical Manager</option>
                                <option value="HEAD_OF_SERVICE">Head of Service</option>
                                <option value="DEPUTY_HEAD">Deputy Head of Service</option>
                                <option value="OFFICIAL_AGENT">Official Agent</option>
                            </select>
                        </div>
                    </div>

                    <div class="input-group">
                        <label class="input-label">Security Verification</label>
                        <div class="captcha-wrapper">
                            <div>
                                <div class="captcha-display">
                                    <div class="captcha-code" id="captchaCode"></div>
                                </div>
                                <div class="input-wrapper" style="margin-top: 12px;">
                                    <i class="fas fa-shield-alt input-icon"></i>
                                    <input 
                                        type="text" 
                                        class="input-field" 
                                        id="captchaInput" 
                                        placeholder="Enter the code above"
                                        required
                                    >
                                </div>
                            </div>
                            <button type="button" class="refresh-captcha" id="refreshCaptcha">
                                <i class="fas fa-sync-alt"></i>
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="btn-submit" id="submitBtn">
                        <span class="btn-text">
                            <span>Access Portal</span>
                            <i class="fas fa-arrow-right"></i>
                        </span>
                        <div class="spinner"></div>
                    </button>
                </form>
            </div>

            <div class="form-footer">
                <p class="copyright">2024 Sharvika. All rights reserved.</p>
            </div>
        </div>
    </div>

    <script>
        // Authentication Database
        const authDatabase = {
            'Bishesh_04': { password: 'Lovejust', team: 'TECHNICAL', name: 'Bishesh' },
            'Ayush_05': { password: 'Lovejust', team: 'HELPLINE', name: 'Ayush' },
            'Soumya_09': { password: 'Lovejust', team: 'TECHNICAL', name: 'Soumya' },
            'Shreyas_00': { password: 'Lovejust', team: 'PUBLISHER', name: 'Shreyas' },
            'Refer_01': { password: 'Lovejust', team: 'HELPLINE', name: 'Refer' }
        };

        let currentCaptcha = '';

        function generateCaptcha() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            let captcha = '';
            for (let i = 0; i < 6; i++) {
                captcha += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            currentCaptcha = captcha;
            document.getElementById('captchaCode').textContent = captcha;
        }

        document.getElementById('refreshCaptcha').addEventListener('click', function() {
            generateCaptcha();
            document.getElementById('captchaInput').value = '';
        });

        generateCaptcha();

        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');

        togglePassword.addEventListener('click', function() {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            this.classList.toggle('fa-eye');
            this.classList.toggle('fa-eye-slash');
        });

        const loginForm = document.getElementById('loginForm');
        const submitBtn = document.getElementById('submitBtn');
        const toast = document.getElementById('toast');
        const loadingOverlay = document.getElementById('loadingOverlay');

        function showToast(type, title, message) {
            const toastIcon = toast.querySelector('i');
            const toastTitle = toast.querySelector('h4');
            const toastMessage = toast.querySelector('p');

            if (type === 'error') {
                toast.classList.remove('success');
                toastIcon.className = 'fas fa-exclamation-circle';
            } else {
                toast.classList.add('success');
                toastIcon.className = 'fas fa-check-circle';
            }

            toastTitle.textContent = title;
            toastMessage.textContent = message;
            toast.classList.add('show');

            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        loginForm.addEventListener('submit', async function(e) {
            e.preventDefault();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const teamname = document.getElementById('teamname').value;
            const position = document.getElementById('position').value;
            const captchaInput = document.getElementById('captchaInput').value;

            // Validate Captcha
            if (captchaInput.toUpperCase() !== currentCaptcha) {
                showToast('error', 'Invalid Captcha', 'Please enter the correct verification code.');
                generateCaptcha();
                document.getElementById('captchaInput').value = '';
                return;
            }

            // Validate Username
            if (!authDatabase[username]) {
                showToast('error', 'Authentication Failed', 'Invalid username or password.');
                generateCaptcha();
                document.getElementById('captchaInput').value = '';
                return;
            }

            // Validate Password
            if (authDatabase[username].password !== password) {
                showToast('error', 'Authentication Failed', 'Invalid username or password.');
                generateCaptcha();
                document.getElementById('captchaInput').value = '';
                return;
            }

            // Validate Team
            if (username !== 'Shreyas_00' && authDatabase[username].team !== teamname) {
                showToast('error', 'Access Denied', 'You are not authorized for this team.');
                return;
            }

            submitBtn.classList.add('loading');
            loadingOverlay.classList.add('active');

            await new Promise(resolve => setTimeout(resolve, 2000));

            submitBtn.classList.remove('loading');
            loadingOverlay.classList.remove('active');

            // Store session
            sessionStorage.setItem('authUser', username);
            sessionStorage.setItem('authTeam', teamname);
            sessionStorage.setItem('authPosition', position);
            sessionStorage.setItem('authName', authDatabase[username].name);

            showToast('success', 'Authentication Successful', 'Redirecting to dashboard...');

            setTimeout(() => {
                // Redirect based on team (Shreyas_00 can access all)
                if (username === 'Shreyas_00') {
                    window.location.href = `${teamname.toLowerCase()}.html`;
                } else {
                    window.location.href = `${authDatabase[username].team.toLowerCase()}.html`;
                }
            }, 1500);
        });
    </script>
</body>
</html>
