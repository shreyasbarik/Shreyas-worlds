<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Authority Login - Sharvika</title>
  <link rel="stylesheet" href="authority.css"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bcrypt.js/2.4.3/bcrypt.min.js"></script>
</head>
<body>
  <div class="authority-bg">
    <div class="glass-card">
      <!-- Animated SVG/Logo -->
      <div class="glass-logo">
        <svg width="60" height="60" viewBox="0 0 60 60">
          <defs>
            <radialGradient id="logo-grad" cx="50%" cy="50%" r="60%">
              <stop offset="0%" stop-color="#e3c7ff"/>
              <stop offset="100%" stop-color="#6a7afc"/>
            </radialGradient>
          </defs>
          <circle cx="30" cy="30" r="27" fill="url(#logo-grad)" opacity="0.88"/>
          <text x="30" y="38" font-size="24" fill="#fff" font-family="Inter" text-anchor="middle" font-weight="bold">S</text>
        </svg>
      </div>
      <h2 class="glass-title">Authority Login</h2>
      <form id="loginForm" autocomplete="off">
        <div class="input-box"><input type="text" name="username" placeholder="Username" required autocomplete="off"></div>
        <div class="input-box"><input type="password" name="password" placeholder="Password" required></div>
        <button type="submit"><span>Login</span></button>
        <div id="auth-status"></div>
      </form>
      <div class="glass-footer">
        <span>Sharvika &copy; 2025</span>
      </div>
    </div>
  </div>
  <script src="authority.js"></script>
</body>
</html>
