<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authority Access - Sharvika</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #000;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* Animated gradient background */
        .gradient-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            z-index: 0;
        }

        /* Floating orbs */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.4;
            animation: float 20s infinite ease-in-out;
            pointer-events: none;
        }

        .orb1 {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.6) 0%, transparent 70%);
            top: -20%;
            left: -10%;
            animation-delay: 0s;
        }

        .orb2 {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.6) 0%, transparent 70%);
            bottom: -15%;
            right: -5%;
            animation-delay: 7s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0); }
            33% { transform: translate(50px, -50px); }
            66% { transform: translate(-30px, 30px); }
        }

        /* Back button */
        .back-home {
            position: fixed;
            top: 24px;
            left: 24px;
            z-index: 1001;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: white;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .back-home:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateX(-4px);
        }

        /* Login container */
        .login-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 440px;
            padding: 20px;
        }

        .login-container {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .login-header {
            padding: 40px 32px 32px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .logo {
            width: 60px;
            height: 60px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: white;
        }

        .login-header h1 {
            font-size: 28px;
            font-weight: 700;
            color: white;
            margin-bottom: 8px;
        }

        .login-header p {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
        }

        .login-form {
            padding: 32px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-field, .select-field {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: white;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
            outline: none;
        }

        .select-field {
            cursor: pointer;
            appearance: none;
            background-image: url("data:image/svg+xml,%3Csvg width='12' height='8' viewBox='0 0 12 8' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1.5L6 6.5L11 1.5' stroke='white' stroke-opacity='0.5' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E");
            background-repeat: no-repeat;
            background-position: right 16px center;
            padding-right: 40px;
        }

        .input-field::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .input-field:focus, .select-field:focus {
            background: rgba(255, 255, 255, 0.08);
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .toggle-password {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: rgba(255, 255, 255, 0.4);
            transition: all 0.3s ease;
        }

        .toggle-password:hover {
            color: rgba(255, 255, 255, 0.8);
        }

        .captcha-wrapper {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 12px;
            align-items: end;
        }

        .captcha-display {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 16px;
            text-align: center;
        }

        .captcha-code {
            font-family: 'Courier New', monospace;
            font-size: 24px;
            font-weight: 700;
            color: white;
            letter-spacing: 6px;
        }

        .refresh-captcha {
            width: 48px;
            height: 48px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: rgba(255, 255, 255, 0.6);
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .refresh-captcha:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: rotate(180deg);
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 24px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(59, 130, 246, 0.4);
        }

        .submit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .toast {
            position: fixed;
            top: 24px;
            right: 24px;
            background: white;
            padding: 16px 20px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            gap: 12px;
            transform: translateX(400px);
            transition: transform 0.4s ease;
            z-index: 1000;
        }

        .toast.show {
            transform: translateX(0);
        }

        .toast.error {
            background: #fef2f2;
            border: 1px solid #fecaca;
        }

        .toast.success {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
        }

        .toast i {
            font-size: 20px;
        }

        .toast.error i {
            color: #dc2626;
        }

        .toast.success i {
            color: #16a34a;
        }

        .toast-content h4 {
            font-size: 14px;
            font-weight: 600;
            color: #111827;
            margin-bottom: 2px;
        }

        .toast-content p {
            font-size: 13px;
            color: #6b7280;
        }

        .loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        .loading.active {
            display: flex;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .back-home {
                top: 16px;
                left: 16px;
                padding: 8px 16px;
                font-size: 13px;
            }
            .login-wrapper {
                padding: 16px;
            }
            .login-form {
                padding: 24px;
            }
            .captcha-wrapper {
                grid-template-columns: 1fr;
            }
            .refresh-captcha {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="gradient-bg"></div>
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>

    <a href="index.html" class="back-home">
        <i class="fas fa-arrow-left"></i>
        Back to Home
    </a>

    <div class="toast" id="toast">
        <i class="fas fa-check-circle"></i>
        <div class="toast-content">
            <h4>Success</h4>
            <p>Message</p>
        </div>
    </div>

    <div class="loading" id="loading">
        <div class="spinner"></div>
    </div>

    <div class="login-wrapper">
        <div class="login-container">
            <div class="login-header">
                <div class="logo">
                    <i class="fas fa-shield-alt"></i>
                </div>
                <h1>SHARVIKA</h1>
                <p>Authority Access Portal</p>
            </div>

            <form class="login-form" id="loginForm">
                <div class="input-group">
                    <label class="input-label">Username</label>
                    <input type="text" class="input-field" id="username" placeholder="Enter username" required>
                </div>

                <div class="input-group">
                    <label class="input-label">Password</label>
                    <div class="input-wrapper">
                        <input type="password" class="input-field" id="password" placeholder="Enter password" required>
                        <i class="fas fa-eye toggle-password" id="togglePassword"></i>
                    </div>
                </div>

                <div class="input-group">
                    <label class="input-label">Team</label>
                    <select class="select-field" id="team" required>
                        <option value="">Select team</option>
                        <option value="HELPLINE">Helpline</option>
                        <option value="TECHNICAL">Technical</option>
                        <option value="PUBLISHER">Publisher</option>
                    </select>
                </div>

                <div class="input-group">
                    <label class="input-label">Position</label>
                    <select class="select-field" id="position" required>
                        <option value="">Select position</option>
                        <option value="Manager">Manager</option>
                        <option value="Team Lead">Team Lead</option>
                        <option value="Senior Agent">Senior Agent</option>
                        <option value="Agent">Agent</option>
                    </select>
                </div>

                <div class="input-group">
                    <label class="input-label">Security Code</label>
                    <div class="captcha-wrapper">
                        <div>
                            <div class="captcha-display">
                                <div class="captcha-code" id="captchaCode"></div>
                            </div>
                            <input type="text" class="input-field" id="captchaInput" placeholder="Enter code" required style="margin-top: 12px;">
                        </div>
                        <button type="button" class="refresh-captcha" id="refreshCaptcha">
                            <i class="fas fa-sync-alt"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="submit-btn">Access Portal</button>
            </form>
        </div>
    </div>

    <script>
        const authDatabase = {
            'Bishesh_04': { password: 'Lovejust', team: 'TECHNICAL', name: 'Bishesh' },
            'Ayush_05': { password: 'Lovejust', team: 'HELPLINE', name: 'Ayush' },
            'Soumya_09': { password: 'Lovejust', team: 'TECHNICAL', name: 'Soumya' },
            'Shreyas_00': { password: 'Lovejust', team: 'PUBLISHER', name: 'Shreyas' },
            'Refer_01': { password: 'Lovejust', team: 'HELPLINE', name: 'Refer' }
        };

        let currentCaptcha = '';

        function generateCaptcha() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            let captcha = '';
            for (let i = 0; i < 6; i++) {
                captcha += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            currentCaptcha = captcha;
            document.getElementById('captchaCode').textContent = captcha;
        }

        generateCaptcha();

        document.getElementById('refreshCaptcha').addEventListener('click', function() {
            generateCaptcha();
            document.getElementById('captchaInput').value = '';
        });

        document.getElementById('togglePassword').addEventListener('click', function() {
            const passwordInput = document.getElementById('password');
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            this.classList.toggle('fa-eye');
            this.classList.toggle('fa-eye-slash');
        });

        function showToast(type, title, message) {
            const toast = document.getElementById('toast');
            toast.className = `toast ${type}`;
            toast.querySelector('i').className = type === 'error' ? 'fas fa-exclamation-circle' : 'fas fa-check-circle';
            toast.querySelector('h4').textContent = title;
            toast.querySelector('p').textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const team = document.getElementById('team').value;
            const position = document.getElementById('position').value;
            const captchaInput = document.getElementById('captchaInput').value;

            if (captchaInput.toUpperCase() !== currentCaptcha) {
                showToast('error', 'Invalid Code', 'Please enter the correct security code');
                generateCaptcha();
                document.getElementById('captchaInput').value = '';
                return;
            }

            if (!authDatabase[username]) {
                showToast('error', 'Access Denied', 'Invalid credentials');
                generateCaptcha();
                document.getElementById('captchaInput').value = '';
                return;
            }

            if (authDatabase[username].password !== password) {
                showToast('error', 'Access Denied', 'Invalid credentials');
                generateCaptcha();
                document.getElementById('captchaInput').value = '';
                return;
            }

            if (username !== 'Shreyas_00' && authDatabase[username].team !== team) {
                showToast('error', 'Access Denied', 'You are not authorized for this team');
                return;
            }

            document.getElementById('loading').classList.add('active');

            await new Promise(resolve => setTimeout(resolve, 1500));

            sessionStorage.setItem('authUser', username);
            sessionStorage.setItem('authTeam', team);
            sessionStorage.setItem('authPosition', position);
            sessionStorage.setItem('authName', authDatabase[username].name);

            showToast('success', 'Access Granted', 'Redirecting...');

            setTimeout(() => {
                if (username === 'Shreyas_00') {
                    window.location.href = `${team.toLowerCase()}.html`;
                } else {
                    window.location.href = `${authDatabase[username].team.toLowerCase()}.html`;
                }
            }, 1000);
        });
    </script>
</body>
</html>
