<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Call Support - Sharvika</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', sans-serif;
            background: #000;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 400px;
            width: 100%;
            text-align: center;
        }

        .avatar {
            width: 120px;
            height: 120px;
            background: rgba(255,255,255,0.1);
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.8; }
        }

        .avatar svg {
            width: 60px;
            height: 60px;
            fill: rgba(255,255,255,0.7);
        }

        h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .status {
            font-size: 16px;
            color: rgba(255,255,255,0.6);
            margin-bottom: 30px;
        }

        .timer {
            font-size: 48px;
            font-weight: 300;
            margin-bottom: 30px;
            display: none;
        }

        .timer.show {
            display: block;
        }

        .end-btn {
            width: 70px;
            height: 70px;
            background: #dc2626;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(220, 38, 38, 0.4);
            transition: transform 0.2s;
        }

        .end-btn:active {
            transform: scale(0.95);
        }

        .end-btn svg {
            width: 32px;
            height: 32px;
            fill: #fff;
            transform: rotate(135deg);
        }

        .error {
            background: rgba(220, 38, 38, 0.2);
            border: 1px solid rgba(220, 38, 38, 0.5);
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: none;
        }

        .error.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="error" id="error"></div>
        
        <div class="avatar">
            <svg viewBox="0 0 24 24">
                <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
            </svg>
        </div>

        <h1>Technical Support</h1>
        <div class="status" id="status">Connecting...</div>
        <div class="timer" id="timer">00:00</div>

        <button class="end-btn" id="endBtn">
            <svg viewBox="0 0 24 24">
                <path d="M20.01 15.38c-1.23 0-2.42-.2-3.53-.56-.35-.12-.74-.03-1.01.24l-1.57 1.97c-2.83-1.35-5.48-3.9-6.89-6.83l1.95-1.66c.27-.28.35-.67.24-1.02-.37-1.11-.56-2.3-.56-3.53 0-.54-.45-.99-.99-.99H4.19C3.65 3 3 3.24 3 3.99 3 13.28 10.73 21 20.01 21c.71 0 .99-.63.99-1.18v-3.45c0-.54-.45-.99-.99-.99z"/>
            </svg>
        </button>
    </div>

    <audio id="remoteAudio" autoplay playsinline></audio>
    <audio id="ringtone" loop src="data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdJivrJBhNjVgodDbq2EcBj+a2/LDciUFLIHO8tiJNwgZaLvt559NEAxQp+PwtmMcBjiR1/LMeSwFJHfH8N2QQAoUXrTp66hVFApGn+DyvmwhBTGH0fPTgjMGHm7A7+OZRQ4ZdNDx0IU2CRxgvO3hnkwOEVmr5O+qVhgITKXi8biCLAYuhsr03ok/CA1esuzvl0cPElKi4vG7bRsFN47W883DcSoGKX3N8d6NOwgWZ7zs4pBADBRcruPwsWYdBjmP1PLPfS0GK4DN8t2RQAoUXrTo7KhWFQlHoe7rwmwhBTCH0fLUgTMGHm2+7+OYRAcadNDx0YU2Bxxgu+3gnEsOEFus5e6qVhgHSKPi8LqAKgYrgMrz3Y0/BwtdsuzvmEUPElKi4vC7bhoFN4/W88+/cSsFKYDN8d6NOwgWZ7rs4Y9ADBVbr+PwsGQeBDiP1PLPfS0GK4DN8t2RQAoUXrTo7KlVFQlHoe7rwmwhBTCG0fLUgTMGHm6/7+OYRAcadNDx0YU2Bxxgu+3hm0sPEA=="></audio>

    <script>
        const status = document.getElementById('status');
        const timer = document.getElementById('timer');
        const endBtn = document.getElementById('endBtn');
        const error = document.getElementById('error');
        const remoteAudio = document.getElementById('remoteAudio');
        const ringtone = document.getElementById('ringtone');

        let peer, localStream, call, callInterval;
        let supportPeerId = null;

        // Get support peer ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        supportPeerId = urlParams.get('support');

        if (!supportPeerId) {
            showError('❌ Invalid call link. Please get a new link from support.');
        } else {
            init();
        }

        async function init() {
            try {
                status.textContent = 'Getting microphone...';
                
                localStream = await navigator.mediaDevices.getUserMedia({ 
                    audio: true, 
                    video: false 
                });

                status.textContent = 'Connecting...';
                
                const userPeerId = 'user-' + Date.now() + '-' + Math.random().toString(36).substr(2, 6);
                
                peer = new Peer(userPeerId, {
                    debug: 2,
                    host: '0.peerjs.com',
                    port: 443,
                    path: '/',
                    secure: true,
                    config: {
                        iceServers: [
                            { urls: 'stun:stun.l.google.com:19302' },
                            { urls: 'stun:stun1.l.google.com:19302' }
                        ]
                    }
                });

                peer.on('open', (id) => {
                    console.log('✅ Connected with ID:', id);
                    makeCall();
                });

                peer.on('error', (err) => {
                    console.error('❌ Error:', err);
                    showError('Connection error. Please try again.');
                });

            } catch (err) {
                console.error('❌ Media error:', err);
                showError('Microphone permission denied');
            }
        }

        function makeCall() {
            status.textContent = 'Calling support...';
            ringtone.play().catch(() => {});
            
            call = peer.call(supportPeerId, localStream, {
                metadata: { reason: 'User requesting support', timestamp: new Date().toISOString() }
            });

            call.on('stream', (remoteStream) => {
                console.log('✅ Call connected');
                ringtone.pause();
                status.textContent = 'Connected';
                timer.classList.add('show');
                
                remoteAudio.srcObject = remoteStream;
                remoteAudio.play().catch(() => {});
                
                startTimer();
            });

            call.on('close', () => {
                endCall();
            });

            call.on('error', () => {
                showError('Call failed. Support may be offline.');
            });

            setTimeout(() => {
                if (call && !call.peerConnection) {
                    ringtone.pause();
                    showError('No answer. Support is offline.');
                }
            }, 30000);
        }

        function startTimer() {
            let seconds = 0;
            callInterval = setInterval(() => {
                seconds++;
                const m = Math.floor(seconds / 60);
                const s = seconds % 60;
                timer.textContent = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
            }, 1000);
        }

        function endCall() {
            ringtone.pause();
            if (callInterval) clearInterval(callInterval);
            if (call) call.close();
            if (localStream) localStream.getTracks().forEach(t => t.stop());
            if (peer) peer.destroy();
            status.textContent = 'Call ended';
            timer.classList.remove('show');
        }

        function showError(msg) {
            error.textContent = msg;
            error.classList.add('show');
            status.textContent = '';
        }

        endBtn.onclick = endCall;

        // Audio unlock
        document.addEventListener('click', () => {
            remoteAudio.play().then(() => remoteAudio.pause()).catch(() => {});
        }, { once: true });
    </script>
</body>
</html>
