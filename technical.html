<script src="firebase-config.js"></script>
<script>
    const ADMIN_EMAILS = [
        'teamsharvika.inbox.@gmail.com',
        'admin@sharvika.com'
    ];

    const menuBtn = document.getElementById('menuBtn');
    const sidebar = document.getElementById('sidebar');
    let currentUser = null;
    let unsubscribers = [];

    // ✅ FIXED: Check sessionStorage first (from authority-login.html)
    const authUser = sessionStorage.getItem('authUser');
    const isAdmin = sessionStorage.getItem('isAdmin');
    const authName = sessionStorage.getItem('authName');

    if (isAdmin === 'true' && authUser) {
        // User logged in via authority-login.html
        currentUser = {
            uid: authUser,
            email: `${authUser}@sharvika.local`,
            displayName: authName || authUser
        };

        // Set admin display
        document.getElementById('adminAvatar').textContent = authName?.charAt(0).toUpperCase() || 'A';
        document.getElementById('adminName').textContent = authName || authUser;

        // Load system stats
        loadSystemStatsLocal();

    } else {
        // Not logged in via authority-login, check Firebase
        window.addEventListener('firebaseReady', async () => {
            auth.onAuthStateChanged(async (user) => {
                if (user) {
                    currentUser = user;
                    const isAdminEmail = ADMIN_EMAILS.includes(user.email);
                    const adminDoc = await db.collection('admins').doc(user.uid).get();
                    
                    if (!isAdminEmail && (!adminDoc.exists || !adminDoc.data().isAdmin)) {
                        showToast('Access Denied: Administrator privileges required', 'error');
                        setTimeout(() => window.location.href = 'index.html', 2000);
                        return;
                    }

                    const name = user.displayName || user.email.split('@')[0];
                    document.getElementById('adminAvatar').textContent = name.charAt(0).toUpperCase();
                    document.getElementById('adminName').textContent = name;
                    
                    loadSystemStats();
                } else {
                    // Not logged in at all
                    showToast('Authentication required', 'error');
                    setTimeout(() => window.location.href = 'authority-login.html', 1500);
                }
            });
        });
    }

    menuBtn.addEventListener('click', () => {
        sidebar.classList.toggle('open');
    });

    document.addEventListener('click', (e) => {
        if (!sidebar.contains(e.target) && !menuBtn.contains(e.target)) {
            sidebar.classList.remove('open');
        }
    });

    // For authority-login users (no Firebase connection)
    async function loadSystemStatsLocal() {
        try {
            const [banned, muted] = await Promise.all([
                db.collection('bannedUsers').get(),
                db.collection('mutedUsers').get()
            ]);

            document.getElementById('settingsBanned').textContent = banned.size;
            document.getElementById('settingsMuted').textContent = muted.size;
        } catch (error) {
            console.error('Error:', error);
            // If Firebase fails, show placeholder data
            document.getElementById('settingsBanned').textContent = '0';
            document.getElementById('settingsMuted').textContent = '0';
        }
    }

    // For Firebase authenticated users
    async function loadSystemStats() {
        try {
            const [banned, muted] = await Promise.all([
                db.collection('bannedUsers').get(),
                db.collection('mutedUsers').get()
            ]);

            document.getElementById('settingsBanned').textContent = banned.size;
            document.getElementById('settingsMuted').textContent = muted.size;
        } catch (error) {
            console.error('Error:', error);
        }
    }

    window.loadSection = function(section) {
        sidebar.classList.remove('open');
        document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
        event.currentTarget.classList.add('active');

        unsubscribers.forEach(unsub => unsub());
        unsubscribers = [];

        const sections = {
            community: ['Community Admin', 'Manage community hub messages'],
            suggestions: ['Suggestion Admin', 'User suggestions and feedback'],
            announcements: ['Post Announcements', 'Send official updates to users'],
            studio: ['Studio Admin', 'Manage art gallery submissions'],
            helpline: ['Technical Data', 'Helpline support messages'],
            banned: ['Banned Users', 'View and manage banned accounts'],
            muted: ['Muted Users', 'View and manage muted accounts'],
            maintenance: ['Maintenance Mode', 'System-wide operational controls'],
            settings: ['System Settings', 'Global configuration management']
        };

        const [title, subtitle] = sections[section] || ['System Settings', 'Global configuration management'];
        document.getElementById('sectionTitle').textContent = title;
        document.getElementById('sectionSubtitle').textContent = subtitle;

        switch(section) {
            case 'community':
                loadContentTable('communityComments', 'Community Messages');
                break;
            case 'suggestions':
                loadContentTable('suggestions', 'User Suggestions');
                break;
            case 'announcements':
                loadAnnouncementPanel();
                break;
            case 'studio':
                loadStudioTable();
                break;
            case 'helpline':
                loadHelplinePanel();
                break;
            case 'banned':
                loadBannedTable();
                break;
            case 'muted':
                loadMutedTable();
                break;
            case 'maintenance':
                loadMaintenancePanel();
                break;
            case 'settings':
                loadSettingsPanel();
                break;
        }
    };

    function loadContentTable(collection, title) {
        const body = document.getElementById('contentBody');
        body.innerHTML = '<div class="loading-container"><div class="spinner"></div><div class="loading-text">Loading data...</div></div>';

        const unsub = db.collection(collection)
            .orderBy('timestamp', 'desc')
            .limit(100)
            .onSnapshot((snapshot) => {
                if (snapshot.empty) {
                    body.innerHTML = `
                        <div class="empty-state">
                            <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                <circle cx="12" cy="12" r="10"/>
                                <path d="M12 6v6l4 2"/>
                            </svg>
                            <div class="empty-title">No ${title} Found</div>
                            <div class="empty-text">Data will appear here when available</div>
                        </div>
                    `;
                    return;
                }

                let html = '<div class="control-panel"><table class="data-table"><thead><tr>';
                html += '<th>User</th><th>Message</th><th>Status</th><th>Time</th><th>Actions</th>';
                html += '</tr></thead><tbody>';

                snapshot.forEach((doc) => {
                    const data = doc.data();
                    const time = data.timestamp ? formatTime(data.timestamp.toDate()) : 'Just now';
                    const initial = data.author ? data.author.charAt(0).toUpperCase() : 'U';

                    html += '<tr>';
                    html += `<td><div class="user-cell">
                        <div class="user-avatar-small">${initial}</div>
                        <div class="user-details">
                            <div class="user-name">${escapeHtml(data.author || 'Anonymous')}</div>
                            <div class="user-email">${escapeHtml(data.authorEmail || '')}</div>
                        </div>
                    </div></td>`;
                    html += `<td>${escapeHtml(data.text?.substring(0, 60) || '')}${data.text?.length > 60 ? '...' : ''}</td>`;
                    html += `<td>`;
                    if (data.highlighted) html += '<span class="status-indicator">HIGHLIGHTED</span> ';
                    if (data.flagged) html += '<span class="status-indicator">FLAGGED</span> ';
                    if (data.warned) html += '<span class="status-indicator">WARNED</span>';
                    if (!data.highlighted && !data.flagged && !data.warned) html += '<span class="status-indicator">ACTIVE</span>';
                    html += `</td>`;
                    html += `<td>${time}</td>`;
                    html += `<td><div class="action-group">
                        <button class="btn btn-icon" onclick="editContent('${doc.id}', '${collection}')" title="Edit">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                            </svg>
                        </button>
                        <button class="btn btn-icon btn-danger" onclick="deleteContent('${doc.id}', '${collection}')" title="Delete">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="3 6 5 6 21 6"/>
                                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                            </svg>
                        </button>
                    </div></td>`;
                    html += '</tr>';
                });

                html += '</tbody></table></div>';
                body.innerHTML = html;
            });

        unsubscribers.push(unsub);
    }

    async function loadMaintenanceSettings() {
        try {
            const [maintenance, community, studio] = await Promise.all([
                db.collection('systemSettings').doc('siteMaintenanceMode').get(),
                db.collection('systemSettings').doc('communityHubStatus').get(),
                db.collection('systemSettings').doc('artPageStatus').get()
            ]);

            if (maintenance.exists && maintenance.data().enabled) {
                document.getElementById('maintenanceToggle').classList.add('active');
                updateStatusLabel('maintenanceToggle', true);
            }

            if (community.exists) {
                if (community.data().readOnly) {
                    document.getElementById('readOnlyToggle').classList.add('active');
                    updateStatusLabel('readOnlyToggle', true);
                }
                if (community.data().enabled === false) {
                    document.getElementById('disableCommunityToggle').classList.add('active');
                    updateStatusLabel('disableCommunityToggle', true);
                }
            }

            if (studio.exists && studio.data().enabled === false) {
                document.getElementById('disableStudioToggle').classList.add('active');
                updateStatusLabel('disableStudioToggle', true);
            }
        } catch (error) {
            console.error('Error:', error);
        }
    }

    function updateStatusLabel(toggleId, isActive) {
        const toggle = document.getElementById(toggleId);
        const statusLabel = toggle.parentElement.querySelector('.status-label');
        const statusText = statusLabel.querySelector('.status-text');
        statusText.textContent = isActive ? 'Active' : 'Inactive';
    }

    window.postAnnouncement = async function(e) {
        e.preventDefault();
        const text = document.getElementById('announcementText').value.trim();
        if (!text) return;

        try {
            await db.collection('announcements').add({
                text: text,
                author: currentUser.displayName || currentUser.email.split('@')[0],
                authorEmail: currentUser.email,
                authorUID: currentUser.uid,
                timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                channel: 'announcements'
            });

            document.getElementById('announcementText').value = '';
            showToast('Announcement published successfully');
        } catch (error) {
            showToast('Error publishing announcement', 'error');
        }
    };

    function formatTime(date) {
        const diff = Date.now() - date;
        const minutes = Math.floor(diff / 60000);
        const hours = Math.floor(minutes / 60);
        const days = Math.floor(hours / 24);

        if (minutes < 1) return 'Just now';
        if (minutes < 60) return `${minutes}m ago`;
        if (hours < 24) return `${hours}h ago`;
        if (days < 7) return `${days}d ago`;
        return date.toLocaleDateString();
    }

    function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function showToast(message, type = 'success') {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.className = `toast ${type}`;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 3000);
    }
