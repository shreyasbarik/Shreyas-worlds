
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Community Hub - Sharvika</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #000000;
            color: #ffffff;
            height: 100vh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        .app-container {
            display: grid;
            grid-template-columns: 320px 1fr;
            height: 100vh;
            position: relative;
        }

        .sidebar {
            background: #0a0a0a;
            border-right: 1px solid #1a1a1a;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid #1a1a1a;
            flex-shrink: 0;
            position: relative;
        }

        .close-sidebar {
            display: none;
            position: absolute;
            top: 16px;
            right: 16px;
            width: 32px;
            height: 32px;
            border: none;
            background: transparent;
            color: #666666;
            cursor: pointer;
            border-radius: 50%;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .close-sidebar:hover {
            background: #1a1a1a;
            color: #ffffff;
        }

        .app-title {
            font-size: 20px;
            font-weight: 500;
            color: #ffffff;
            margin-bottom: 4px;
        }

        .app-subtitle {
            font-size: 13px;
            color: #666666;
        }

        .sidebar-search {
            padding: 12px 16px;
            border-bottom: 1px solid #1a1a1a;
            flex-shrink: 0;
        }

        .search-input {
            width: 100%;
            padding: 12px 16px;
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-input:focus {
            border-color: #3a3a3a;
        }

        .search-input::placeholder {
            color: #666666;
        }

        .sidebar-menu {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
        }

        .menu-item {
            padding: 16px 20px;
            border-bottom: 1px solid #1a1a1a;
            cursor: pointer;
            transition: background 0.2s;
            position: relative;
            min-height: 64px;
            display: flex;
            align-items: center;
            -webkit-tap-highlight-color: transparent;
        }

        .menu-item:hover {
            background: #1a1a1a;
        }

        .menu-item:active {
            background: #2a2a2a;
        }

        .menu-item.active {
            background: #1a1a1a;
        }

        .menu-item-content {
            flex: 1;
            min-width: 0;
        }

        .menu-item-title {
            font-size: 15px;
            font-weight: 500;
            color: #ffffff;
            margin-bottom: 4px;
            line-height: 1.2;
        }

        .menu-item-subtitle {
            font-size: 13px;
            color: #666666;
            line-height: 1.2;
        }

        .unread-badge {
            background: #ffffff;
            color: #000000;
            min-width: 22px;
            height: 22px;
            border-radius: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 600;
            padding: 0 6px;
            margin-left: 8px;
            flex-shrink: 0;
        }

        .sidebar-footer {
            padding: 16px 20px;
            border-top: 1px solid #1a1a1a;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            background: #ffffff;
            color: #000000;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 16px;
            flex-shrink: 0;
        }

        .user-info {
            flex: 1;
            min-width: 0;
        }

        .user-name {
            font-size: 14px;
            font-weight: 500;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .user-status {
            font-size: 12px;
            color: #666666;
        }

        .logout-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s;
            flex-shrink: 0;
            -webkit-tap-highlight-color: transparent;
        }

        .logout-icon:hover {
            background: #1a1a1a;
        }

        .logout-icon:active {
            background: #2a2a2a;
        }

        .chat-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: #000000;
            overflow: hidden;
        }

        .chat-header {
            padding: 16px 24px;
            background: #0a0a0a;
            border-bottom: 1px solid #1a1a1a;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
            min-height: 72px;
            position: relative;
        }

        .mobile-back-btn {
            display: none;
            width: 40px;
            height: 40px;
            border: none;
            background: transparent;
            color: #ffffff;
            cursor: pointer;
            border-radius: 50%;
            align-items: center;
            justify-content: center;
            margin-right: 8px;
            transition: background 0.2s;
            -webkit-tap-highlight-color: transparent;
        }

        .mobile-back-btn:hover {
            background: #1a1a1a;
        }

        .mobile-back-btn:active {
            background: #2a2a2a;
        }

        .chat-avatar {
            width: 40px;
            height: 40px;
            background: #ffffff;
            color: #000000;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 16px;
            flex-shrink: 0;
        }

        .chat-info {
            flex: 1;
            min-width: 0;
        }

        .chat-title {
            font-size: 15px;
            font-weight: 500;
            color: #ffffff;
            margin-bottom: 2px;
            line-height: 1.2;
        }

        .chat-subtitle {
            font-size: 13px;
            color: #666666;
            line-height: 1.2;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            scroll-behavior: smooth;
        }

        .messages-container::-webkit-scrollbar {
            width: 6px;
        }

        .messages-container::-webkit-scrollbar-track {
            background: transparent;
        }

        .messages-container::-webkit-scrollbar-thumb {
            background: #1a1a1a;
            border-radius: 3px;
        }

        .message {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
            animation: messageSlideIn 0.2s ease-out;
        }

        @keyframes messageSlideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message-avatar {
            width: 36px;
            height: 36px;
            background: #ffffff;
            color: #000000;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
            flex-shrink: 0;
        }

        .message-content {
            flex: 1;
            max-width: calc(100% - 46px);
            min-width: 0;
        }

        .message-header {
            display: flex;
            align-items: baseline;
            gap: 8px;
            margin-bottom: 4px;
            flex-wrap: wrap;
        }

        .message-author {
            font-size: 14px;
            font-weight: 500;
            color: #ffffff;
        }

        .message-time {
            font-size: 12px;
            color: #666666;
        }

        .message-bubble {
            background: #0a0a0a;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid #1a1a1a;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        .message-bubble.highlighted {
            background: #1a1a1a;
            border-color: #2a2a2a;
        }

        .message-text {
            font-size: 14px;
            line-height: 1.5;
            color: #ffffff;
            word-wrap: break-word;
            overflow-wrap: break-word;
            white-space: pre-wrap;
        }

        .admin-reply {
            background: #1a1a1a;
            padding: 10px 14px;
            border-radius: 8px;
            margin-top: 8px;
            border-left: 2px solid #ffffff;
        }

        .reply-label {
            font-size: 11px;
            color: #666666;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        .reply-text {
            font-size: 13px;
            color: #ffffff;
            line-height: 1.4;
            word-wrap: break-word;
        }

        .input-container {
            padding: 16px 24px;
            background: #0a0a0a;
            border-top: 1px solid #1a1a1a;
            flex-shrink: 0;
            max-height: 200px;
            transition: all 0.3s ease;
        }

        .restriction-banner {
            padding: 12px 24px;
            background: #1a1a1a;
            border-top: 1px solid #2a2a2a;
            color: #666666;
            text-align: center;
            font-size: 13px;
            font-weight: 500;
            line-height: 1.4;
        }

        .input-wrapper {
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }

        .input-box {
            flex: 1;
            background: #1a1a1a;
            border-radius: 24px;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            border: 1px solid #2a2a2a;
            transition: border-color 0.2s;
            max-height: 120px;
            overflow: hidden;
        }

        .input-box:focus-within {
            border-color: #3a3a3a;
        }

        .message-input {
            flex: 1;
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            resize: none;
            font-family: inherit;
            min-height: 20px;
            max-height: 96px;
            overflow-y: auto;
            line-height: 1.4;
        }

        .message-input::placeholder {
            color: #666666;
        }

        .message-input::-webkit-scrollbar {
            width: 0;
        }

        .char-counter {
            font-size: 11px;
            color: #666666;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .send-button {
            width: 48px;
            height: 48px;
            background: #ffffff;
            color: #000000;
            border: none;
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0;
            -webkit-tap-highlight-color: transparent;
        }

        .send-button:hover:not(:disabled) {
            background: #e0e0e0;
            transform: scale(1.05);
        }

        .send-button:active:not(:disabled) {
            transform: scale(0.95);
        }

        .send-button:disabled {
            background: #1a1a1a;
            color: #666666;
            cursor: not-allowed;
            transform: none;
        }

        .loading {
            text-align: center;
            padding: 40px 20px;
            color: #666666;
        }

        .loading-spinner {
            width: 32px;
            height: 32px;
            border: 3px solid #1a1a1a;
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 12px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #ffffff;
            color: #000000;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            z-index: 1000;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            max-width: 90%;
            text-align: center;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        .mobile-menu-toggle {
            display: none;
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1001;
            background: #0a0a0a;
            border: 1px solid #1a1a1a;
            border-radius: 12px;
            padding: 12px;
            cursor: pointer;
            width: 48px;
            height: 48px;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            -webkit-tap-highlight-color: transparent;
        }

        .mobile-menu-toggle:hover {
            background: #1a1a1a;
        }

        .mobile-menu-toggle:active {
            background: #2a2a2a;
            transform: scale(0.95);
        }

        .mobile-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 999;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .mobile-overlay.show {
            display: block;
            opacity: 1;
        }

        .sidebar-menu::-webkit-scrollbar {
            width: 6px;
        }

        .sidebar-menu::-webkit-scrollbar-thumb {
            background: #1a1a1a;
            border-radius: 3px;
        }

        /* Enhanced Mobile Styles */
        @media (max-width: 900px) {
            .app-container {
                grid-template-columns: 1fr;
                position: relative;
            }

            .sidebar {
                position: fixed;
                left: -100%;
                top: 0;
                width: 300px;
                max-width: 85vw;
                height: 100vh;
                z-index: 1000;
                transform: translateX(-100%);
            }

            .sidebar.show {
                left: 0;
                transform: translateX(0);
            }

            .close-sidebar {
                display: flex;
            }

            .mobile-menu-toggle {
                display: flex;
            }

            .mobile-back-btn {
                display: flex;
            }

            .chat-header {
                padding-left: 16px;
            }

            .messages-container {
                padding: 16px 16px 20px;
            }

            .input-container {
                padding: 12px 16px 16px;
                /* Add safe area for iOS */
                padding-bottom: max(16px, env(safe-area-inset-bottom));
            }

            .input-box {
                border-radius: 20px;
                padding: 10px 16px;
            }

            .send-button {
                width: 44px;
                height: 44px;
                border-radius: 22px;
            }

            .message-input {
                font-size: 16px; /* Prevents zoom on iOS */
            }

            .search-input {
                font-size: 16px; /* Prevents zoom on iOS */
            }
        }

        @media (max-width: 600px) {
            .sidebar {
                width: 280px;
            }

            .sidebar-header {
                padding: 16px;
            }

            .sidebar-search {
                padding: 10px 12px;
            }

            .menu-item {
                padding: 14px 16px;
                min-height: 60px;
            }

            .sidebar-footer {
                padding: 12px 16px;
            }

            .messages-container {
                padding: 12px;
            }

            .input-container {
                padding: 10px 12px 14px;
                padding-bottom: max(14px, env(safe-area-inset-bottom));
            }

            .chat-header {
                padding: 10px 12px;
                min-height: 64px;
            }

            .input-wrapper {
                gap: 8px;
            }

            .send-button {
                width: 40px;
                height: 40px;
                border-radius: 20px;
            }

            .message-bubble {
                border-radius: 10px;
                padding: 10px 14px;
            }
        }

        /* Enhanced Desktop Styles */
        @media (min-width: 1200px) {
            .app-container {
                grid-template-columns: 360px 1fr;
            }

            .sidebar {
                width: 360px;
            }

            .messages-container {
                padding: 24px 32px;
            }

            .input-container {
                padding: 20px 32px;
            }

            .chat-header {
                padding: 20px 32px;
            }
        }

        /* Smooth transitions for better UX */
        .menu-item,
        .send-button,
        .logout-icon,
        .mobile-menu-toggle,
        .mobile-back-btn,
        .close-sidebar {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Better focus states for accessibility */
        .search-input:focus,
        .message-input:focus {
            outline: 2px solid #3a3a3a;
            outline-offset: 2px;
        }

        .menu-item:focus,
        .send-button:focus,
        .logout-icon:focus,
        .mobile-menu-toggle:focus,
        .mobile-back-btn:focus {
            outline: 2px solid #3a3a3a;
            outline-offset: 2px;
        }

        /* Prevent text selection on UI elements */
        .menu-item,
        .chat-header,
        .sidebar-header,
        .sidebar-footer,
        .send-button,
        .mobile-menu-toggle {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
    </style>
</head>
<body>
    <div class="mobile-menu-toggle" id="mobileMenuToggle" onclick="toggleSidebar()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2">
            <line x1="3" y1="12" x2="21" y2="12"/>
            <line x1="3" y1="6" x2="21" y2="6"/>
            <line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
    </div>

    <div class="mobile-overlay" id="mobileOverlay" onclick="toggleSidebar()"></div>

    <div class="app-container">
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <button class="close-sidebar" onclick="toggleSidebar()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
                <div class="app-title">SHARVIKA</div>
                <div class="app-subtitle">Community Hub</div>
            </div>

            <div class="sidebar-search">
                <input type="text" class="search-input" placeholder="Search messages..." id="searchInput">
            </div>

            <div class="sidebar-menu">
                <div class="menu-item active" onclick="switchChannel('community')">
                    <div class="menu-item-content">
                        <div class="menu-item-title">Community Chat</div>
                        <div class="menu-item-subtitle">Public discussion</div>
                    </div>
                </div>
                <div class="menu-item" onclick="switchChannel('announcements')">
                    <div class="menu-item-content">
                        <div class="menu-item-title">Announcements</div>
                        <div class="menu-item-subtitle">Official updates</div>
                    </div>
                    <span class="unread-badge" id="announcementBadge" style="display: none;">0</span>
                </div>
                <div class="menu-item" onclick="openCallSupport()">
                    <div class="menu-item-content">
                        <div class="menu-item-title">Call Technical Support</div>
                        <div class="menu-item-subtitle">Live voice and video assistance</div>
                    </div>
                </div>
                <div class="menu-item" onclick="openSupport()">
                    <div class="menu-item-content">
                        <div class="menu-item-title">Email Support</div>
                        <div class="menu-item-subtitle">teamsharvika.inbox@gmail.com</div>
                    </div>
                </div>
            </div>

            <div class="sidebar-footer">
                <div class="user-avatar" id="sidebarAvatar">U</div>
                <div class="user-info">
                    <div class="user-name" id="sidebarName">User</div>
                    <div class="user-status" id="userStatus">Online</div>
                </div>
                <div class="logout-icon" onclick="logout()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>
                    </svg>
                </div>
            </div>
        </div>

        <div class="chat-container">
            <div class="chat-header">
                <button class="mobile-back-btn" onclick="toggleSidebar()">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M15 18l-6-6 6-6"/>
                    </svg>
                </button>
                <div class="chat-avatar" id="chatAvatar">C</div>
                <div class="chat-info">
                    <div class="chat-title" id="chatTitle">Community Chat</div>
                    <div class="chat-subtitle" id="chatSubtitle">Public discussion</div>
                </div>
            </div>

            <div class="messages-container" id="messagesContainer">
                <div class="loading">
                    <div class="loading-spinner"></div>
                    <div>Loading messages...</div>
                </div>
            </div>

            <div id="restrictionBanner"></div>

            <div class="input-container" id="inputContainer">
                <div class="input-wrapper">
                    <div class="input-box">
                        <textarea 
                            class="message-input" 
                            id="messageInput" 
                            placeholder="Write a message..."
                            rows="1"
                            maxlength="1000"
                        ></textarea>
                        <span class="char-counter" id="charCounter">0/1000</span>
                    </div>
                    <button class="send-button" id="sendBtn" onclick="sendMessage()">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="firebase-config.js"></script>
    <script>
        window.addEventListener('firebaseReady', initializePage);

        let currentUser = null;
        let currentChannel = 'community';
        let messagesUnsubscribe = null;

        function initializePage() {
            auth.onAuthStateChanged((user) => {
                if (user) {
                    currentUser = user;
                    const name = user.displayName || user.email.split('@')[0];
                    document.getElementById('sidebarAvatar').textContent = name.charAt(0).toUpperCase();
                    document.getElementById('sidebarName').textContent = name;
                    loadMessages();
                } else {
                    window.location.href = 'signin.html';
                }
            });

            setupInputHandlers();
            setupResizeHandlers();
        }

        function setupInputHandlers() {
            const messageInput = document.getElementById('messageInput');
            
            messageInput.addEventListener('input', function() {
                autoResizeTextarea(this);
                document.getElementById('charCounter').textContent = `${this.value.length}/1000`;
            });

            messageInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });

            // Handle mobile keyboard
            if (window.innerWidth <= 900) {
                messageInput.addEventListener('focus', function() {
                    setTimeout(() => {
                        this.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }, 300);
                });
            }
        }

        function autoResizeTextarea(textarea) {
            textarea.style.height = 'auto';
            const newHeight = Math.min(textarea.scrollHeight, 96);
            textarea.style.height = newHeight + 'px';
        }

        function setupResizeHandlers() {
            window.addEventListener('resize', function() {
                if (window.innerWidth > 900) {
                    const sidebar = document.getElementById('sidebar');
                    const overlay = document.getElementById('mobileOverlay');
                    sidebar.classList.remove('show');
                    overlay.classList.remove('show');
                }
            });

            // Handle orientation change on mobile
            window.addEventListener('orientationchange', function() {
                setTimeout(() => {
                    const messagesContainer = document.getElementById('messagesContainer');
                    messagesContainer.scrollTop = messagesContainer.scrollHeight;
                }, 500);
            });
        }

        window.toggleSidebar = function() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('mobileOverlay');
            
            sidebar.classList.toggle('show');
            overlay.classList.toggle('show');
            
            // Prevent body scroll when sidebar is open on mobile
            if (sidebar.classList.contains('show')) {
                document.body.style.overflow = 'hidden';
            } else {
                document.body.style.overflow = '';
            }
        };

        window.switchChannel = function(channel) {
            currentChannel = channel;
            
            // Close sidebar on mobile after selection
            if (window.innerWidth <= 900) {
                toggleSidebar();
            }
            
            document.querySelectorAll('.menu-item').forEach(item => item.classList.remove('active'));
            event.currentTarget.classList.add('active');

            if (channel === 'community') {
                document.getElementById('chatAvatar').textContent = 'C';
                document.getElementById('chatTitle').textContent = 'Community Chat';
                document.getElementById('chatSubtitle').textContent = 'Public discussion';
                document.getElementById('inputContainer').style.display = 'block';
            } else if (channel === 'announcements') {
                document.getElementById('chatAvatar').textContent = 'A';
                document.getElementById('chatTitle').textContent = 'Announcements';
                document.getElementById('chatSubtitle').textContent = 'Official updates from team';
                document.getElementById('inputContainer').style.display = 'none';
            }

            loadMessages();
        };

        window.openCallSupport = function() {
            if (window.innerWidth <= 900) toggleSidebar();
            window.location.href = 'support.html';
        };

        window.openSupport = function() {
            if (window.innerWidth <= 900) toggleSidebar();
            window.location.href = 'mailto:teamsharvika.inbox@gmail.com';
        };

        window.sendMessage = async function() {
            if (currentChannel !== 'community' || !currentUser) return;

            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text) return;

            // Disable send button temporarily
            const sendBtn = document.getElementById('sendBtn');
            sendBtn.disabled = true;

            try {
                await db.collection('communityComments').add({
                    text: text,
                    author: currentUser.displayName || currentUser.email.split('@')[0],
                    authorEmail: currentUser.email,
                    authorUID: currentUser.uid,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                    channel: 'community'
                });

                input.value = '';
                input.style.height = 'auto';
                document.getElementById('charCounter').textContent = '0/1000';
                
                // Scroll to bottom
                const container = document.getElementById('messagesContainer');
                setTimeout(() => container.scrollTop = container.scrollHeight, 100);
                
            } catch (error) {
                console.error('Error:', error);
                showToast('Failed to send message');
            } finally {
                sendBtn.disabled = false;
            }
        };

        function loadMessages() {
            const container = document.getElementById('messagesContainer');
            const collectionName = currentChannel === 'community' ? 'communityComments' : 'announcements';
            
            if (messagesUnsubscribe) messagesUnsubscribe();

            messagesUnsubscribe = db.collection(collectionName)
                .orderBy('timestamp', 'asc')
                .limit(100)
                .onSnapshot((snapshot) => {
                    if (snapshot.empty) {
                        container.innerHTML = '<div class="loading">No messages yet</div>';
                        return;
                    }

                    let html = '';
                    snapshot.forEach((doc) => {
                        const msg = doc.data();
                        const timeAgo = msg.timestamp ? formatTime(msg.timestamp.toDate()) : 'now';
                        const initial = msg.author ? msg.author.charAt(0).toUpperCase() : '?';

                        html += `
                            <div class="message">
                                <div class="message-avatar">${initial}</div>
                                <div class="message-content">
                                    <div class="message-header">
                                        <span class="message-author">${escapeHtml(msg.author || 'Anonymous')}</span>
                                        <span class="message-time">${timeAgo}</span>
                                    </div>
                                    <div class="message-bubble ${msg.highlighted ? 'highlighted' : ''}">
                                        <div class="message-text">${escapeHtml(msg.text)}</div>
                                        ${msg.adminReply ? `
                                            <div class="admin-reply">
                                                <div class="reply-label">Team Response</div>
                                                <div class="reply-text">${escapeHtml(msg.adminReply)}</div>
                                            </div>
                                        ` : ''}
                                    </div>
                                </div>
                            </div>
                        `;
                    });

                    container.innerHTML = html;
                    setTimeout(() => container.scrollTop = container.scrollHeight, 100);
                });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatTime(date) {
            const diff = Date.now() - date;
            const minutes = Math.floor(diff / 60000);
            const hours = Math.floor(minutes / 60);
            const days = Math.floor(hours / 24);

            if (minutes < 1) return 'now';
            if (minutes < 60) return `${minutes}m ago`;
            if (hours < 24) return `${hours}h ago`;
            if (days < 7) return `${days}d ago`;
            return date.toLocaleDateString();
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        window.logout = async function() {
            if (confirm('Logout?')) {
                if (messagesUnsubscribe) messagesUnsubscribe();
                await auth.signOut();
                window.location.href = 'signin.html';
            }
        };

        // Close sidebar when clicking outside on mobile
        document.addEventListener('click', function(e) {
            if (window.innerWidth <= 900) {
                const sidebar = document.getElementById('sidebar');
                const toggle = document.getElementById('mobileMenuToggle');
                
                if (sidebar.classList.contains('show') && 
                    !sidebar.contains(e.target) && 
                    !toggle.contains(e.target)) {
                    toggleSidebar();
                }
            }
        });

        // Prevent zoom on double tap for mobile
        let lastTouchEnd = 0;
        document.addEventListener('touchend', function(event) {
            const now = (new Date()).getTime();
            if (now - lastTouchEnd <= 300) {
                event.preventDefault();
            }
            lastTouchEnd = now;
        }, false);
    </script>
</body>
</html>
