<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatGPT</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/11.1.1/marked.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #343541;
            --bg-secondary: #202123;
            --bg-chat: #343541;
            --text-primary: #ececf1;
            --text-secondary: #c5c5d1;
            --border-color: #565869;
            --accent: #19c37d;
            --accent-hover: #1a7f5a;
            --user-bg: #343541;
            --assistant-bg: #444654;
            --hover-bg: #2a2b32;
            --input-bg: #40414f;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: var(--bg-chat);
            color: var(--text-primary);
            overflow: hidden;
        }

        .app {
            display: flex;
            height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 260px;
            background: var(--bg-secondary);
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border-color);
        }

        .sidebar-header {
            padding: 12px;
        }

        .new-chat-btn {
            width: 100%;
            padding: 12px;
            background: transparent;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: background 0.2s;
        }

        .new-chat-btn:hover {
            background: var(--hover-bg);
        }

        .conversations {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }

        .conversation-item {
            padding: 12px;
            margin-bottom: 4px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            color: var(--text-secondary);
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .conversation-item:hover {
            background: var(--hover-bg);
        }

        .conversation-item.active {
            background: var(--hover-bg);
            color: var(--text-primary);
        }

        .conversation-title {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .delete-btn {
            opacity: 0;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 4px;
        }

        .conversation-item:hover .delete-btn {
            opacity: 1;
        }

        .sidebar-footer {
            border-top: 1px solid var(--border-color);
            padding: 12px;
        }

        .user-info {
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-info:hover {
            background: var(--hover-bg);
        }

        .user-avatar {
            width: 32px;
            height: 32px;
            background: var(--accent);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
        }

        .user-name {
            font-size: 14px;
            color: var(--text-primary);
        }

        /* Main Chat */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            scroll-behavior: smooth;
        }

        .chat-messages {
            max-width: 768px;
            margin: 0 auto;
            padding: 24px;
        }

        .message {
            margin-bottom: 24px;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message-wrapper {
            display: flex;
            gap: 16px;
        }

        .message-wrapper.user {
            padding: 24px;
            background: var(--user-bg);
        }

        .message-wrapper.assistant {
            padding: 24px;
            background: var(--assistant-bg);
        }

        .message-avatar {
            width: 30px;
            height: 30px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-weight: 600;
            font-size: 14px;
        }

        .message-avatar.user {
            background: #5436da;
        }

        .message-avatar.assistant {
            background: var(--accent);
        }

        .message-content {
            flex: 1;
            font-size: 16px;
            line-height: 1.75;
            color: var(--text-primary);
        }

        .message-content p {
            margin-bottom: 16px;
        }

        .message-content p:last-child {
            margin-bottom: 0;
        }

        .message-content ul, .message-content ol {
            margin-left: 24px;
            margin-bottom: 16px;
        }

        .message-content li {
            margin-bottom: 8px;
        }

        .message-content code {
            background: var(--bg-secondary);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
        }

        .message-content pre {
            background: #000;
            padding: 16px;
            border-radius: 8px;
            overflow-x: auto;
            margin-bottom: 16px;
            position: relative;
        }

        .message-content pre code {
            background: transparent;
            padding: 0;
            font-size: 14px;
            line-height: 1.5;
        }

        .code-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #000;
            padding: 8px 16px;
            border-radius: 8px 8px 0 0;
            margin-bottom: -8px;
        }

        .code-lang {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .copy-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 4px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }

        .copy-btn:hover {
            background: var(--hover-bg);
            color: var(--text-primary);
        }

        /* Input Area */
        .input-area {
            padding: 24px;
            background: var(--bg-chat);
            border-top: 1px solid var(--border-color);
        }

        .input-container {
            max-width: 768px;
            margin: 0 auto;
            position: relative;
        }

        .input-wrapper {
            background: var(--input-bg);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            display: flex;
            align-items: flex-end;
            padding: 12px;
            gap: 12px;
        }

        .input-wrapper:focus-within {
            border-color: var(--text-secondary);
        }

        .message-input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 16px;
            outline: none;
            resize: none;
            max-height: 200px;
            font-family: inherit;
            line-height: 1.5;
        }

        .message-input::placeholder {
            color: var(--text-secondary);
        }

        .send-btn {
            width: 32px;
            height: 32px;
            background: var(--text-primary);
            border: none;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.2s;
            flex-shrink: 0;
        }

        .send-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .send-btn:hover:not(:disabled) {
            opacity: 0.8;
        }

        /* Empty State */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            padding: 48px 24px;
            text-align: center;
        }

        .empty-logo {
            width: 64px;
            height: 64px;
            background: var(--accent);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 24px;
            color: #fff;
        }

        .empty-title {
            font-size: 32px;
            font-weight: 600;
            margin-bottom: 48px;
        }

        .example-prompts {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 12px;
            max-width: 900px;
            width: 100%;
        }

        .example-prompt {
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
        }

        .example-prompt:hover {
            background: var(--hover-bg);
        }

        .prompt-title {
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .prompt-text {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.4;
        }

        /* Typing Indicator */
        .typing {
            display: inline-flex;
            gap: 4px;
            padding: 8px 0;
        }

        .typing span {
            width: 8px;
            height: 8px;
            background: var(--text-secondary);
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }

        .typing span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                opacity: 0.3;
                transform: translateY(0);
            }
            30% {
                opacity: 1;
                transform: translateY(-10px);
            }
        }

        /* Mobile Menu */
        .mobile-menu-btn {
            display: none;
            position: fixed;
            top: 16px;
            left: 16px;
            z-index: 1000;
            width: 40px;
            height: 40px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-primary);
            cursor: pointer;
            align-items: center;
            justify-content: center;
        }

        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 999;
        }

        /* Settings Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 32px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 600;
        }

        .modal-close {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 24px;
        }

        .setting-item {
            margin-bottom: 24px;
        }

        .setting-label {
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
            display: block;
        }

        .setting-select {
            width: 100%;
            padding: 12px;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 14px;
            cursor: pointer;
        }

        .setting-btn {
            width: 100%;
            padding: 12px;
            background: var(--accent);
            border: none;
            border-radius: 6px;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .setting-btn:hover {
            background: var(--accent-hover);
        }

        /* Scrollbar */
        .conversations::-webkit-scrollbar,
        .chat-container::-webkit-scrollbar,
        .modal-content::-webkit-scrollbar {
            width: 8px;
        }

        .conversations::-webkit-scrollbar-track,
        .chat-container::-webkit-scrollbar-track,
        .modal-content::-webkit-scrollbar-track {
            background: transparent;
        }

        .conversations::-webkit-scrollbar-thumb,
        .chat-container::-webkit-scrollbar-thumb,
        .modal-content::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                top: 0;
                left: 0;
                bottom: 0;
                transform: translateX(-100%);
                transition: transform 0.3s;
                z-index: 1000;
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .sidebar-overlay.active {
                display: block;
            }

            .mobile-menu-btn {
                display: flex;
            }

            .example-prompts {
                grid-template-columns: 1fr;
            }

            .chat-messages {
                padding: 16px;
            }

            .input-area {
                padding: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="app">
        <!-- Mobile Menu Button -->
        <button class="mobile-menu-btn" onclick="toggleSidebar()">☰</button>
        <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <button class="new-chat-btn" onclick="newChat()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    New chat
                </button>
            </div>

            <div class="conversations" id="conversations"></div>

            <div class="sidebar-footer">
                <div class="user-info" onclick="openSettings()">
                    <div class="user-avatar">U</div>
                    <div class="user-name">User</div>
                </div>
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="main">
            <div class="chat-container" id="chatContainer">
                <div class="empty-state" id="emptyState">
                    <div class="empty-logo">AI</div>
                    <h1 class="empty-title">How can I help you today?</h1>
                    <div class="example-prompts">
                        <div class="example-prompt" onclick="usePrompt('Explain quantum computing in simple terms')">
                            <div class="prompt-title">📚 Explain concept</div>
                            <div class="prompt-text">Explain quantum computing in simple terms</div>
                        </div>
                        <div class="example-prompt" onclick="usePrompt('Write a Python script to analyze data')">
                            <div class="prompt-title">💻 Write code</div>
                            <div class="prompt-text">Write a Python script to analyze data</div>
                        </div>
                        <div class="example-prompt" onclick="usePrompt('Help me plan a trip to Japan')">
                            <div class="prompt-title">✈️ Plan something</div>
                            <div class="prompt-text">Help me plan a trip to Japan</div>
                        </div>
                        <div class="example-prompt" onclick="usePrompt('Create a workout routine for beginners')">
                            <div class="prompt-title">🏋️ Get advice</div>
                            <div class="prompt-text">Create a workout routine for beginners</div>
                        </div>
                    </div>
                </div>
                <div class="chat-messages" id="chatMessages" style="display: none;"></div>
            </div>

            <div class="input-area">
                <div class="input-container">
                    <div class="input-wrapper">
                        <textarea 
                            class="message-input" 
                            id="messageInput" 
                            placeholder="Message ChatGPT..."
                            rows="1"
                            onkeydown="handleKeyPress(event)"
                            oninput="autoResize(this)"
                        ></textarea>
                        <button class="send-btn" id="sendBtn" onclick="sendMessage()" disabled>
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                                <path d="M7 11L12 6L17 11M12 18V7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Settings Modal -->
    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">Settings</h2>
                <button class="modal-close" onclick="closeSettings()">×</button>
            </div>

            <div class="setting-item">
                <label class="setting-label">Model</label>
                <select class="setting-select" id="modelSelect">
                    <option value="gemini-1.5-flash">Gemini 1.5 Flash (Fast)</option>
                    <option value="gemini-1.5-pro">Gemini 1.5 Pro (Powerful)</option>
                    <option value="gemini-pro">Gemini Pro</option>
                </select>
            </div>

            <div class="setting-item">
                <label class="setting-label">Temperature</label>
                <select class="setting-select" id="temperatureSelect">
                    <option value="0.3">More Focused</option>
                    <option value="0.7" selected>Balanced</option>
                    <option value="1.0">More Creative</option>
                </select>
            </div>

            <div class="setting-item">
                <button class="setting-btn" onclick="clearAllChats()">Clear All Chats</button>
            </div>

            <div class="setting-item">
                <button class="setting-btn" onclick="exportChats()">Export Chats</button>
            </div>
        </div>
    </div>

    <script>
        // Configuration
        const API_KEY = 'AIzaSyAQ__fupm_Ll4AawchbtEvFvx2fLn7kkCg';
        let currentModel = 'gemini-1.5-flash';
        let currentTemperature = 0.7;

        // State
        let conversations = [];
        let currentConversationId = null;
        let isGenerating = false;

        // Initialize
        loadConversations();
        updateSendButton();

        // Input handling
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');

        messageInput.addEventListener('input', () => {
            updateSendButton();
        });

        function updateSendButton() {
            const hasText = messageInput.value.trim().length > 0;
            sendBtn.disabled = !hasText || isGenerating;
        }

        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = Math.min(textarea.scrollHeight, 200) + 'px';
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        // Send message
        async function sendMessage() {
            const message = messageInput.value.trim();
            if (!message || isGenerating) return;

            if (!currentConversationId) {
                currentConversationId = Date.now().toString();
                conversations.unshift({
                    id: currentConversationId,
                    title: message.substring(0, 50),
                    messages: [],
                    createdAt: new Date().toISOString()
                });
            }

            const conversation = conversations.find(c => c.id === currentConversationId);
            
            // Add user message
            conversation.messages.push({
                role: 'user',
                content: message
            });

            messageInput.value = '';
            autoResize(messageInput);
            updateSendButton();
            
            displayMessages();
            saveConversations();
            renderConversations();

            // Show typing indicator
            const typingDiv = document.createElement('div');
            typingDiv.className = 'message';
            typingDiv.innerHTML = `
                <div class="message-wrapper assistant">
                    <div class="message-avatar assistant">AI</div>
                    <div class="message-content">
                        <div class="typing">
                            <span></span>
                            <span></span>
                            <span></span>
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('chatMessages').appendChild(typingDiv);
            scrollToBottom();

            isGenerating = true;
            updateSendButton();

            try {
                const response = await generateResponse(conversation.messages);
                
                // Remove typing indicator
                typingDiv.remove();

                // Add assistant message
                conversation.messages.push({
                    role: 'assistant',
                    content: response
                });

                displayMessages();
                saveConversations();

            } catch (error) {
                console.error('Error:', error);
                typingDiv.remove();
                
                conversation.messages.push({
                    role: 'assistant',
                    content: 'Sorry, I encountered an error. Please try again.'
                });
                
                displayMessages();
            }

            isGenerating = false;
            updateSendButton();
        }

        // Generate AI response
        async function generateResponse(messages) {
            const contents = messages.map(msg => ({
                role: msg.role === 'user' ? 'user' : 'model',
                parts: [{ text: msg.content }]
            }));

            const response = await fetch(
                `https://generativelanguage.googleapis.com/v1beta/models/${currentModel}:generateContent?key=${API_KEY}`,
                {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: contents,
                        generationConfig: {
                            temperature: currentTemperature,
                            maxOutputTokens: 8192,
                        }
                    })
                }
            );

            const data = await response.json();
            
            if (!response.ok) {
                throw new Error(data.error?.message || 'API Error');
            }

            return data.candidates[0].content.parts[0].text;
        }

        // Display messages
        function displayMessages() {
            const conversation = conversations.find(c => c.id === currentConversationId);
            if (!conversation) return;

            document.getElementById('emptyState').style.display = 'none';
            document.getElementById('chatMessages').style.display = 'block';

            const messagesContainer = document.getElementById('chatMessages');
            messagesContainer.innerHTML = '';

            conversation.messages.forEach((msg, index) => {
                const messageDiv = document.createElement('div');
                messageDiv.className = 'message';

                const isUser = msg.role === 'user';
                const avatar = isUser ? 'U' : 'AI';
                const content = isUser ? escapeHtml(msg.content) : formatMarkdown(msg.content);

                messageDiv.innerHTML = `
                    <div class="message-wrapper ${isUser ? 'user' : 'assistant'}">
                        <div class="message-avatar ${isUser ? 'user' : 'assistant'}">${avatar}</div>
                        <div class="message-content">${content}</div>
                    </div>
                `;

                messagesContainer.appendChild(messageDiv);
            });

            // Highlight code blocks
            document.querySelectorAll('pre code').forEach((block) => {
                hljs.highlightElement(block);
            });

            scrollToBottom();
        }

        // Format markdown
        function formatMarkdown(text) {
            // Convert markdown to HTML
            let html = marked.parse(text);

            // Add copy buttons to code blocks
            html = html.replace(/<pre><code class="language-(\w+)">/g, (match, lang) => {
                return `<div class="code-header">
                    <span class="code-lang">${lang}</span>
                    <button class="copy-btn" onclick="copyCode(this)">Copy code</button>
                </div><pre><code class="language-${lang}">`;
            });

            html = html.replace(/<pre><code>/g, 
                `<div class="code-header">
                    <span class="code-lang">code</span>
                    <button class="copy-btn" onclick="copyCode(this)">Copy code</button>
                </div><pre><code>`
            );

            return html;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Copy code
        function copyCode(btn) {
            const codeBlock = btn.closest('.code-header').nextElementSibling.querySelector('code');
            navigator.clipboard.writeText(codeBlock.textContent);
            btn.textContent = 'Copied!';
            setTimeout(() => btn.textContent = 'Copy code', 2000);
        }

        // Scroll to bottom
        function scrollToBottom() {
            const container = document.getElementById('chatContainer');
            setTimeout(() => {
                container.scrollTop = container.scrollHeight;
            }, 100);
        }

        // Conversations management
        function loadConversations() {
            const saved = localStorage.getItem('chatgpt_conversations');
            if (saved) {
                conversations = JSON.parse(saved);
                renderConversations();
            }
        }

        function saveConversations() {
            localStorage.setItem('chatgpt_conversations', JSON.stringify(conversations));
        }

        function renderConversations() {
            const container = document.getElementById('conversations');
            container.innerHTML = '';

            conversations.forEach(conv => {
                const div = document.createElement('div');
                div.className = `conversation-item ${conv.id === currentConversationId ? 'active' : ''}`;
                div.innerHTML = `
                    <span class="conversation-title">${conv.title}</span>
                    <button class="delete-btn" onclick="deleteConversation('${conv.id}', event)">×</button>
                `;
                div.onclick = (e) => {
                    if (!e.target.classList.contains('delete-btn')) {
                        loadConversation(conv.id);
                    }
                };
                container.appendChild(div);
            });
        }

        function newChat() {
            currentConversationId = null;
            document.getElementById('emptyState').style.display = 'flex';
            document.getElementById('chatMessages').style.display = 'none';
            renderConversations();
            if (window.innerWidth <= 768) toggleSidebar();
        }

        function loadConversation(id) {
            currentConversationId = id;
            displayMessages();
            renderConversations();
            if (window.innerWidth <= 768) toggleSidebar();
        }

        function deleteConversation(id, event) {
            event.stopPropagation();
            if (confirm('Delete this conversation?')) {
                conversations = conversations.filter(c => c.id !== id);
                if (currentConversationId === id) {
                    newChat();
                }
                saveConversations();
                renderConversations();
            }
        }

        function clearAllChats() {
            if (confirm('Clear all conversations? This cannot be undone.')) {
                conversations = [];
                currentConversationId = null;
                saveConversations();
                renderConversations();
                newChat();
                closeSettings();
            }
        }

        function exportChats() {
            const data = JSON.stringify(conversations, null, 2);
            const blob = new Blob([data], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `chatgpt-export-${Date.now()}.json`;
            a.click();
        }

        // Example prompts
        function usePrompt(prompt) {
            messageInput.value = prompt;
            updateSendButton();
            autoResize(messageInput);
            messageInput.focus();
        }

        // Settings
        function openSettings() {
            document.getElementById('settingsModal').classList.add('show');
            document.getElementById('modelSelect').value = currentModel;
            document.getElementById('temperatureSelect').value = currentTemperature;
        }

        function closeSettings() {
            document.getElementById('settingsModal').classList.remove('show');
            currentModel = document.getElementById('modelSelect').value;
            currentTemperature = parseFloat(document.getElementById('temperatureSelect').value);
        }

        // Mobile sidebar
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('sidebarOverlay').classList.toggle('active');
        }

        // Configure marked
        marked.setOptions({
            breaks: true,
            gfm: true
        });
    </script>
</body>
</html>
