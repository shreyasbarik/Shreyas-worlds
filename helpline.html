<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Helpline Workspace - Sharvika</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background: #0e0e0e;
            color: #ffffff;
            height: 100vh;
            overflow: hidden;
        }

        /* Layout */
        .workspace {
            display: grid;
            grid-template-columns: 320px 1fr 380px;
            height: 100vh;
        }

        /* Left Panel - Channels */
        .channels-panel {
            background: #1a1a1a;
            border-right: 1px solid #2a2a2a;
            display: flex;
            flex-direction: column;
        }

        .panel-header {
            padding: 20px;
            border-bottom: 1px solid #2a2a2a;
        }

        .workspace-title {
            font-size: 20px;
            font-weight: 500;
            color: #ffffff;
            margin-bottom: 4px;
        }

        .workspace-subtitle {
            font-size: 13px;
            color: #8e8e93;
        }

        .channels-list {
            flex: 1;
            overflow-y: auto;
        }

        .channel-item {
            padding: 16px 20px;
            border-bottom: 1px solid #2a2a2a;
            cursor: pointer;
            transition: background 0.2s;
            position: relative;
        }

        .channel-item:hover {
            background: #2a2a2a;
        }

        .channel-item.active {
            background: #2a2a2a;
        }

        .channel-name {
            font-size: 15px;
            font-weight: 500;
            color: #ffffff;
            margin-bottom: 4px;
        }

        .channel-desc {
            font-size: 13px;
            color: #8e8e93;
        }

        .message-count {
            position: absolute;
            top: 50%;
            right: 20px;
            transform: translateY(-50%);
            background: #ffffff;
            color: #000000;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 600;
        }

        .panel-footer {
            padding: 16px 20px;
            border-top: 1px solid #2a2a2a;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .admin-avatar {
            width: 40px;
            height: 40px;
            background: #ffffff;
            color: #000000;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 16px;
        }

        .admin-info {
            flex: 1;
        }

        .admin-name {
            font-size: 14px;
            font-weight: 500;
            color: #ffffff;
        }

        .admin-role {
            font-size: 12px;
            color: #8e8e93;
        }

        .logout-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s;
        }

        .logout-btn:hover {
            background: #2a2a2a;
        }

        /* Middle Panel - Messages */
        .messages-panel {
            display: flex;
            flex-direction: column;
            background: #0e0e0e;
        }

        .messages-header {
            padding: 16px 24px;
            background: #1a1a1a;
            border-bottom: 1px solid #2a2a2a;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-avatar {
            width: 40px;
            height: 40px;
            background: #ffffff;
            color: #000000;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 16px;
        }

        .header-title {
            font-size: 15px;
            font-weight: 500;
            color: #ffffff;
        }

        .header-subtitle {
            font-size: 13px;
            color: #8e8e93;
        }

        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px;
        }

        .messages-area::-webkit-scrollbar {
            width: 6px;
        }

        .messages-area::-webkit-scrollbar-track {
            background: transparent;
        }

        .messages-area::-webkit-scrollbar-thumb {
            background: #2a2a2a;
            border-radius: 3px;
        }

        .message-item {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
            padding: 12px;
            background: #1a1a1a;
            border-radius: 12px;
            transition: background 0.2s;
            cursor: pointer;
        }

        .message-item:hover {
            background: #2a2a2a;
        }

        .message-item.selected {
            background: #2a2a2a;
        }

        .message-avatar {
            width: 36px;
            height: 36px;
            background: #ffffff;
            color: #000000;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
            flex-shrink: 0;
        }

        .message-body {
            flex: 1;
        }

        .message-author {
            font-size: 14px;
            font-weight: 500;
            color: #ffffff;
            margin-bottom: 4px;
        }

        .message-text {
            font-size: 14px;
            color: #8e8e93;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .message-time {
            font-size: 12px;
            color: #6e6e73;
            white-space: nowrap;
        }

        /* Input for announcements */
        .announcement-input {
            padding: 16px 24px;
            background: #1a1a1a;
            border-top: 1px solid #2a2a2a;
        }

        .input-wrapper {
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }

        .input-box {
            flex: 1;
            background: #2a2a2a;
            border-radius: 24px;
            padding: 12px 20px;
        }

        .textarea-input {
            width: 100%;
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            resize: none;
            max-height: 120px;
            font-family: inherit;
        }

        .textarea-input::placeholder {
            color: #6e6e73;
        }

        .send-btn {
            width: 44px;
            height: 44px;
            background: #ffffff;
            color: #000000;
            border: none;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .send-btn:hover {
            transform: scale(1.05);
        }

        .send-btn:disabled {
            background: #2a2a2a;
            color: #6e6e73;
            cursor: not-allowed;
        }

        /* Right Panel - Actions */
        .actions-panel {
            background: #1a1a1a;
            border-left: 1px solid #2a2a2a;
            display: flex;
            flex-direction: column;
        }

        .actions-header {
            padding: 20px;
            border-bottom: 1px solid #2a2a2a;
        }

        .actions-title {
            font-size: 16px;
            font-weight: 500;
            color: #ffffff;
        }

        .actions-body {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .selected-message {
            background: #2a2a2a;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 24px;
        }

        .selected-author {
            font-size: 14px;
            font-weight: 500;
            color: #ffffff;
            margin-bottom: 8px;
        }

        .selected-text {
            font-size: 14px;
            color: #8e8e93;
            line-height: 1.5;
        }

        .action-button {
            width: 100%;
            padding: 14px;
            background: #2a2a2a;
            border: 1px solid #3a3a3a;
            color: #ffffff;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            justify-content: center;
        }

        .action-button:hover {
            background: #3a3a3a;
        }

        .action-button.delete {
            background: rgba(255, 59, 48, 0.1);
            border-color: rgba(255, 59, 48, 0.3);
            color: #ff3b30;
        }

        .action-button.delete:hover {
            background: rgba(255, 59, 48, 0.2);
        }

        .reply-section {
            margin-top: 24px;
        }

        .reply-label {
            font-size: 13px;
            color: #8e8e93;
            margin-bottom: 12px;
        }

        .reply-textarea {
            width: 100%;
            min-height: 100px;
            padding: 12px;
            background: #2a2a2a;
            border: 1px solid #3a3a3a;
            border-radius: 12px;
            color: #ffffff;
            font-size: 14px;
            font-family: inherit;
            resize: vertical;
            outline: none;
        }

        .reply-textarea:focus {
            border-color: #4a4a4a;
        }

        .reply-send {
            width: 100%;
            padding: 12px;
            background: #ffffff;
            color: #000000;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 12px;
        }

        .no-selection {
            text-align: center;
            padding: 40px 20px;
            color: #6e6e73;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #6e6e73;
        }

        .loading-spinner {
            width: 32px;
            height: 32px;
            border: 3px solid #2a2a2a;
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 12px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 1200px) {
            .workspace {
                grid-template-columns: 280px 1fr;
            }

            .actions-panel {
                display: none;
            }
        }

        @media (max-width: 768px) {
            .workspace {
                grid-template-columns: 1fr;
            }

            .channels-panel {
                display: none;
            }
        }

        .channels-list::-webkit-scrollbar,
        .actions-body::-webkit-scrollbar {
            width: 6px;
        }

        .channels-list::-webkit-scrollbar-track,
        .actions-body::-webkit-scrollbar-track {
            background: transparent;
        }

        .channels-list::-webkit-scrollbar-thumb,
        .actions-body::-webkit-scrollbar-thumb {
            background: #2a2a2a;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div class="workspace">
        <!-- Left Panel -->
        <div class="channels-panel">
            <div class="panel-header">
                <div class="workspace-title">SHARVIKA</div>
                <div class="workspace-subtitle">Admin Workspace</div>
            </div>

            <div class="channels-list">
                <div class="channel-item active" onclick="switchChannel('community')">
                    <div class="channel-name">Community Chat</div>
                    <div class="channel-desc">User discussions</div>
                    <span class="message-count" id="communityCount">0</span>
                </div>
                <div class="channel-item" onclick="switchChannel('announcements')">
                    <div class="channel-name">Announcements</div>
                    <div class="channel-desc">Post official updates</div>
                    <span class="message-count" id="announcementCount">0</span>
                </div>
            </div>

            <div class="panel-footer">
                <div class="admin-avatar" id="adminAvatar">A</div>
                <div class="admin-info">
                    <div class="admin-name" id="adminName">Admin</div>
                    <div class="admin-role">Helpline Team</div>
                </div>
                <div class="logout-btn" onclick="logout()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>
                    </svg>
                </div>
            </div>
        </div>

        <!-- Middle Panel -->
        <div class="messages-panel">
            <div class="messages-header">
                <div class="header-info">
                    <div class="header-avatar" id="headerAvatar">C</div>
                    <div>
                        <div class="header-title" id="headerTitle">Community Chat</div>
                        <div class="header-subtitle" id="headerSubtitle">User discussions</div>
                    </div>
                </div>
            </div>

            <div class="messages-area" id="messagesArea">
                <div class="loading">
                    <div class="loading-spinner"></div>
                    <div>Loading messages...</div>
                </div>
            </div>

            <div class="announcement-input" id="announcementInput" style="display: none;">
                <div class="input-wrapper">
                    <div class="input-box">
                        <textarea 
                            class="textarea-input" 
                            id="announcementText" 
                            placeholder="Write an announcement..."
                            rows="1"
                            oninput="autoResize(this)"
                        ></textarea>
                    </div>
                    <button class="send-btn" onclick="sendAnnouncement()">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <!-- Right Panel -->
        <div class="actions-panel">
            <div class="actions-header">
                <div class="actions-title">Message Actions</div>
            </div>

            <div class="actions-body" id="actionsBody">
                <div class="no-selection">
                    Select a message to perform actions
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { 
            auth, 
            db,
            onAuthStateChanged,
            signOut,
            collection,
            addDoc,
            query,
            orderBy,
            onSnapshot,
            deleteDoc,
            doc,
            updateDoc,
            serverTimestamp
        } from './firebase-config.js';

        let currentChannel = 'community';
        let selectedMessage = null;

        // Check Auth
        onAuthStateChanged(auth, (user) => {
            if (user) {
                const name = user.displayName || user.email.split('@')[0];
                const initial = name.charAt(0).toUpperCase();
                document.getElementById('adminAvatar').textContent = initial;
                document.getElementById('adminName').textContent = name;
                loadMessages();
            } else {
                window.location.href = 'signin.html';
            }
        });

        // Switch Channel
        window.switchChannel = function(channel) {
            currentChannel = channel;
            selectedMessage = null;

            // Update active state
            document.querySelectorAll('.channel-item').forEach(item => item.classList.remove('active'));
            event.currentTarget.classList.add('active');

            // Update header
            if (channel === 'community') {
                document.getElementById('headerAvatar').textContent = 'C';
                document.getElementById('headerTitle').textContent = 'Community Chat';
                document.getElementById('headerSubtitle').textContent = 'User discussions';
                document.getElementById('announcementInput').style.display = 'none';
            } else {
                document.getElementById('headerAvatar').textContent = 'A';
                document.getElementById('headerTitle').textContent = 'Announcements';
                document.getElementById('headerSubtitle').textContent = 'Post official updates';
                document.getElementById('announcementInput').style.display = 'block';
            }

            loadMessages();
            updateActionsPanel();
        };

        // Auto-resize textarea
        window.autoResize = function(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = Math.min(textarea.scrollHeight, 120) + 'px';
        };

        // Send Announcement
        window.sendAnnouncement = async function() {
            const input = document.getElementById('announcementText');
            const text = input.value.trim();

            if (!text) return;

            try {
                await addDoc(collection(db, 'announcements'), {
                    text: text,
                    author: 'Sharvika Team',
                    authorEmail: auth.currentUser.email,
                    authorUID: auth.currentUser.uid,
                    timestamp: serverTimestamp()
                });

                input.value = '';
                autoResize(input);
            } catch (error) {
                console.error('Error sending announcement:', error);
                alert('Error sending announcement');
            }
        };

        // Load Messages
        function loadMessages() {
            const messagesArea = document.getElementById('messagesArea');
            const collectionName = currentChannel === 'community' ? 'communityComments' : 'announcements';
            const q = query(collection(db, collectionName), orderBy('timestamp', 'desc'));

            onSnapshot(q, (snapshot) => {
                // Update count
                if (currentChannel === 'community') {
                    document.getElementById('communityCount').textContent = snapshot.size;
                } else {
                    document.getElementById('announcementCount').textContent = snapshot.size;
                }

                if (snapshot.empty) {
                    messagesArea.innerHTML = '<div class="loading">No messages yet</div>';
                    return;
                }

                let html = '';
                snapshot.forEach((docSnapshot) => {
                    const msg = { id: docSnapshot.id, ...docSnapshot.data() };
                    const timeAgo = msg.timestamp ? formatTime(msg.timestamp.toDate()) : 'now';
                    const initial = msg.author.charAt(0).toUpperCase();

                    html += `
                        <div class="message-item ${selectedMessage?.id === msg.id ? 'selected' : ''}" onclick='selectMessage(${JSON.stringify(msg).replace(/'/g, "&apos;")})'>
                            <div class="message-avatar">${initial}</div>
                            <div class="message-body">
                                <div class="message-author">${msg.author}</div>
                                <div class="message-text">${msg.text}</div>
                            </div>
                            <div class="message-time">${timeAgo}</div>
                        </div>
                    `;
                });

                messagesArea.innerHTML = html;
            });
        }

        // Select Message
        window.selectMessage = function(message) {
            selectedMessage = message;
            document.querySelectorAll('.message-item').forEach(item => item.classList.remove('selected'));
            event.currentTarget.classList.add('selected');
            updateActionsPanel();
        };

        // Update Actions Panel
        function updateActionsPanel() {
            const actionsBody = document.getElementById('actionsBody');

            if (!selectedMessage) {
                actionsBody.innerHTML = '<div class="no-selection">Select a message to perform actions</div>';
                return;
            }

            actionsBody.innerHTML = `
                <div class="selected-message">
                    <div class="selected-author">${selectedMessage.author}</div>
                    <div class="selected-text">${selectedMessage.text}</div>
                </div>

                ${currentChannel === 'community' ? `
                    <button class="action-button" onclick="toggleHighlight()">
                        ${selectedMessage.highlighted ? '★ Remove Highlight' : '☆ Highlight Message'}
                    </button>

                    <button class="action-button delete" onclick="deleteMessage()">
                        × Delete Message
                    </button>

                    <div class="reply-section">
                        <div class="reply-label">Send Reply</div>
                        <textarea class="reply-textarea" id="replyText" placeholder="Write your reply..."></textarea>
                        <button class="reply-send" onclick="sendReply()">Send Reply</button>
                    </div>
                ` : `
                    <button class="action-button delete" onclick="deleteMessage()">
                        × Delete Announcement
                    </button>
                `}
            `;
        }

        // Toggle Highlight
        window.toggleHighlight = async function() {
            if (!selectedMessage) return;

            try {
                await updateDoc(doc(db, 'communityComments', selectedMessage.id), {
                    highlighted: !selectedMessage.highlighted
                });
                selectedMessage.highlighted = !selectedMessage.highlighted;
                updateActionsPanel();
            } catch (error) {
                console.error('Error toggling highlight:', error);
                alert('Error updating message');
            }
        };

        // Send Reply
        window.sendReply = async function() {
            const replyText = document.getElementById('replyText').value.trim();
            if (!replyText || !selectedMessage) return;

            try {
                await updateDoc(doc(db, 'communityComments', selectedMessage.id), {
                    adminReply: replyText
                });
                document.getElementById('replyText').value = '';
                alert('Reply sent successfully');
            } catch (error) {
                console.error('Error sending reply:', error);
                alert('Error sending reply');
            }
        };

        // Delete Message
        window.deleteMessage = async function() {
            if (!selectedMessage) return;
            if (!confirm('Are you sure you want to delete this message?')) return;

            try {
                const collectionName = currentChannel === 'community' ? 'communityComments' : 'announcements';
                await deleteDoc(doc(db, collectionName, selectedMessage.id));
                selectedMessage = null;
                updateActionsPanel();
            } catch (error) {
                console.error('Error deleting message:', error);
                alert('Error deleting message');
            }
        };

        // Format Time
        function formatTime(date) {
            const now = new Date();
            const diff = now - date;
            const seconds = Math.floor(diff / 1000);
            const minutes = Math.floor(seconds / 60);
            const hours = Math.floor(minutes / 60);

            if (seconds < 60) return 'now';
            if (minutes < 60) return `${minutes}m`;
            if (hours < 24) return `${hours}h`;
            
            return date.toLocaleDateString();
        }

        // Logout
        window.logout = async function() {
            if (confirm('Logout from workspace?')) {
                try {
                    await signOut(auth);
                    window.location.href = 'signin.html';
                } catch (error) {
                    console.error('Logout error:', error);
                }
            }
        };
    </script>
</body>
</html>
