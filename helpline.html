<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sharvika Call Centre - Helpline</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        :root{
            --bg:#000000;
            --fg:#ffffff;
            --fg-dim:rgba(255,255,255,.6);
            --fg-dimmer:rgba(255,255,255,.4);
            --panel-bg:rgba(255,255,255,.03);
            --panel-br:rgba(255,255,255,.06);
            --panel-bg-hover:rgba(255,255,255,.04);
            --panel-br-hover:rgba(255,255,255,.08);
            --btn-bg:rgba(255,255,255,.95);
            --btn-fg:#000000;
        }

        *{margin:0;padding:0;box-sizing:border-box}
        html,body{height:100%; -webkit-text-size-adjust:100%}
        body{
            font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background:var(--bg); color:var(--fg);
            letter-spacing:-0.02em; -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
            touch-action:manipulation; -webkit-tap-highlight-color:transparent; overscroll-behavior-y:none;
            padding-bottom:env(safe-area-inset-bottom);
        }

        .dashboard{max-width:1400px;margin:0 auto;padding:24px}

        /* CALL LINK SECTION - IMPORTANT */
        .call-link-section {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.1), rgba(59, 130, 246, 0.1));
            border: 2px solid rgba(16, 185, 129, 0.3);
            border-radius: 20px;
            padding: 32px;
            margin-bottom: 24px;
            text-align: center;
        }

        .call-link-section h2 {
            font-size: 24px;
            margin-bottom: 16px;
            color: #10b981;
        }

        .call-link-section p {
            font-size: 14px;
            color: var(--fg-dim);
            margin-bottom: 24px;
        }

        #qrcode {
            display: inline-block;
            padding: 16px;
            background: white;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .call-url {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            word-break: break-all;
            font-family: monospace;
            font-size: 13px;
        }

        .copy-btn {
            background: var(--btn-bg);
            color: var(--btn-fg);
            border: none;
            border-radius: 12px;
            padding: 14px 28px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .copy-btn:hover {
            transform: translateY(-2px);
        }

        .copy-btn:active {
            transform: translateY(0);
        }

        .header{
            background:var(--panel-bg); border:1px solid var(--panel-br);
            border-radius:16px; padding:20px 22px; margin-bottom:24px;
            display:flex; align-items:center; justify-content:space-between; gap:20px; flex-wrap:wrap;
        }

        .header-left h1{font-size:22px; font-weight:600; letter-spacing:-0.03em; margin-bottom:6px}
        .peer-info{font-size:12px; color:var(--fg-dimmer); font-family:ui-monospace, monospace; font-weight:500}

        .status-badge{
            padding:8px 16px; border-radius:999px; font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.45px;
        }
        .status-online{background:var(--btn-bg); color:var(--btn-fg)}
        .status-offline{background:rgba(255,255,255,.05); color:var(--fg-dimmer)}

        /* Incoming call */
        .incoming-call{
            background:var(--panel-bg); border:2px solid rgba(255,255,255,.15);
            border-radius:20px; padding:40px 32px; margin-bottom:22px; text-align:center; display:none;
            animation:border-pulse 2s ease-in-out infinite;
        }
        .incoming-call.show{display:block}
        @keyframes border-pulse{
            0%,100%{border-color:rgba(255,255,255,.15)}
            50%{border-color:rgba(255,255,255,.3)}
        }
        .caller-avatar{width:100px;height:100px;border-radius:50%;margin:0 auto 18px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.05)}
        .caller-avatar svg{width:48px;height:48px;fill:rgba(255,255,255,.9)}
        .incoming-call h2{font-size:22px;font-weight:700;margin-bottom:8px}
        .incoming-call p{font-size:13px;color:var(--fg-dim);margin-bottom:18px}
        .call-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
        .btn{padding:14px 28px;border-radius:12px;border:none;font-size:15px;font-weight:700;cursor:pointer;transition:transform .2s}
        .btn:hover{transform:translateY(-2px)}
        .btn-primary{background:var(--btn-bg);color:var(--btn-fg)}
        .btn-secondary{background:rgba(255,255,255,.1);color:var(--fg)}

        /* Active call */
        .active-call{background:var(--panel-bg); border:1px solid var(--panel-br); border-radius:20px; padding:32px; margin-bottom:22px; display:none;}
        .active-call.show{display:block}
        .call-duration{font-size:48px;font-weight:300;margin-bottom:8px;text-align:center}
        .end-call-btn{width:100%;background:var(--btn-bg);color:var(--btn-fg);padding:16px;border-radius:14px;border:none;font-size:15px;font-weight:800;cursor:pointer;margin-top:20px}

        @media (max-width:768px){
            .call-link-section{padding:24px}
            .call-link-section h2{font-size:20px}
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <!-- Header -->
        <div class="header">
            <div class="header-left">
                <h1>🎧 Sharvika Call Centre</h1>
                <div class="peer-info">Agent ID: <span id="peerId">Connecting...</span></div>
            </div>
            <div class="status-badge status-offline" id="statusBadge">Offline</div>
        </div>

        <!-- CALL LINK SECTION -->
        <div class="call-link-section" id="callLinkSection" style="display:none;">
            <h2>📞 Share This Link With Users</h2>
            <p>Users can scan the QR code or click the link to call you directly</p>
            
            <div id="qrcode"></div>
            
            <div class="call-url" id="callUrl">Generating link...</div>
            
            <button class="copy-btn" id="copyBtn">📋 Copy Link</button>
        </div>

        <!-- Incoming Call -->
        <div class="incoming-call" id="incomingCall">
            <div class="caller-avatar">
                <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            </div>
            <h2>📞 Incoming Call</h2>
            <p id="incomingMeta">User requesting support</p>
            <div class="call-actions">
                <button class="btn btn-primary" id="acceptBtn">Accept Call</button>
                <button class="btn btn-secondary" id="declineBtn">Decline</button>
            </div>
        </div>

        <!-- Active Call -->
        <div class="active-call" id="activeCall">
            <div class="call-duration" id="callDuration">00:00</div>
            <button class="end-call-btn" id="endCallBtn">End Call</button>
        </div>
    </div>

    <audio id="remoteAudio" autoplay playsinline></audio>
    <audio id="ringtone" loop src="data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdJivrJBhNjVgodDbq2EcBj+a2/LDciUFLIHO8tiJNwgZaLvt559NEAxQp+PwtmMcBjiR1/LMeSwFJHfH8N2QQAoUXrTp66hVFApGn+DyvmwhBTGH0fPTgjMGHm7A7+OZRQ4ZdNDx0IU2CRxgvO3hnkwOEVmr5O+qVhgITKXi8biCLAYuhsr03ok/CA1esuzvl0cPElKi4vG7bRsFN47W883DcSoGKX3N8d6NOwgWZ7zs4pBADBRcruPwsWYdBjmP1PLPfS0GK4DN8t2RQAoUXrTo7KhWFQlHoe7rwmwhBTCH0fLUgTMGHm2+7+OYRAcadNDx0YU2Bxxgu+3gnEsOEFus5e6qVhgHSKPi8LqAKgYrgMrz3Y0/BwtdsuzvmEUPElKi4vC7bhoFN4/W88+/cSsFKYDN8d6NOwgWZ7rs4Y9ADBVbr+PwsGQeBDiP1PLPfS0GK4DN8t2RQAoUXrTo7KlVFQlHoe7rwmwhBTCG0fLUgTMGHm6/7+OYRAcadNDx0YU2Bxxgu+3hm0sPEA=="></audio>

    <script>
        const peerId = document.getElementById('peerId');
        const statusBadge = document.getElementById('statusBadge');
        const callLinkSection = document.getElementById('callLinkSection');
        const callUrl = document.getElementById('callUrl');
        const copyBtn = document.getElementById('copyBtn');
        const incomingCall = document.getElementById('incomingCall');
        const incomingMeta = document.getElementById('incomingMeta');
        const activeCall = document.getElementById('activeCall');
        const acceptBtn = document.getElementById('acceptBtn');
        const declineBtn = document.getElementById('declineBtn');
        const endCallBtn = document.getElementById('endCallBtn');
        const callDurationDisplay = document.getElementById('callDuration');
        const remoteAudio = document.getElementById('remoteAudio');
        const ringtone = document.getElementById('ringtone');

        let peer, localStream, currentCall = null, callTimer = null, callDuration = 0;
        let myPeerId = null;

        // Generate unique ID
        function generatePeerId() {
            return 'support-' + Date.now() + '-' + Math.random().toString(36).substr(2, 6);
        }

        // Start peer
        async function init() {
            try {
                // Get mic permission
                localStream = await navigator.mediaDevices.getUserMedia({ 
                    audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
                    video: false 
                });

                // Create unique peer ID
                myPeerId = generatePeerId();
                
                peer = new Peer(myPeerId, {
                    debug: 2,
                    host: '0.peerjs.com',
                    port: 443,
                    path: '/',
                    secure: true,
                    config: {
                        iceServers: [
                            { urls: 'stun:stun.l.google.com:19302' },
                            { urls: 'stun:stun1.l.google.com:19302' },
                            { urls: 'stun:stun2.l.google.com:19302' }
                        ]
                    }
                });

                peer.on('open', (id) => {
                    console.log('✅ Helpline connected with ID:', id);
                    peerId.textContent = id;
                    statusBadge.textContent = 'Online';
                    statusBadge.className = 'status-badge status-online';
                    
                    // Generate call link
                    const baseUrl = window.location.origin + window.location.pathname.replace('helpline.html', '');
                    const callLink = baseUrl + 'call.html?support=' + id;
                    callUrl.textContent = callLink;
                    
                    // Generate QR code
                    document.getElementById('qrcode').innerHTML = '';
                    new QRCode(document.getElementById('qrcode'), {
                        text: callLink,
                        width: 200,
                        height: 200
                    });
                    
                    callLinkSection.style.display = 'block';
                });

                peer.on('call', (call) => {
                    console.log('📞 Incoming call from:', call.peer);
                    currentCall = call;
                    
                    const meta = call.metadata || {};
                    incomingMeta.textContent = meta.reason || 'User requesting support';
                    
                    incomingCall.classList.add('show');
                    ringtone.play().catch(() => {});
                });

                peer.on('error', (err) => {
                    console.error('❌ Peer error:', err);
                    statusBadge.textContent = 'Error';
                    statusBadge.className = 'status-badge status-offline';
                });

            } catch (error) {
                console.error('❌ Init error:', error);
                alert('Microphone permission required');
            }
        }

        // Copy link
        copyBtn.onclick = () => {
            navigator.clipboard.writeText(callUrl.textContent).then(() => {
                copyBtn.textContent = '✅ Copied!';
                setTimeout(() => {
                    copyBtn.textContent = '📋 Copy Link';
                }, 2000);
            });
        };

        // Accept call
        acceptBtn.onclick = () => {
            if (!currentCall) return;
            
            ringtone.pause();
            ringtone.currentTime = 0;
            incomingCall.classList.remove('show');
            
            currentCall.answer(localStream);
            
            currentCall.on('stream', (remoteStream) => {
                console.log('🎙️ Receiving audio');
                remoteAudio.srcObject = remoteStream;
                remoteAudio.play().catch(() => {});
                startCall();
            });

            currentCall.on('close', () => {
                endCall();
            });
        };

        // Decline call
        declineBtn.onclick = () => {
            if (currentCall) currentCall.close();
            currentCall = null;
            ringtone.pause();
            incomingCall.classList.remove('show');
        };

        // End call
        endCallBtn.onclick = () => {
            if (currentCall) currentCall.close();
            endCall();
        };

        function startCall() {
            activeCall.classList.add('show');
            callDuration = 0;
            callTimer = setInterval(() => {
                callDuration++;
                const m = Math.floor(callDuration / 60);
                const s = callDuration % 60;
                callDurationDisplay.textContent = String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
            }, 1000);
        }

        function endCall() {
            if (callTimer) clearInterval(callTimer);
            activeCall.classList.remove('show');
            currentCall = null;
        }

        // Audio unlock
        document.addEventListener('click', () => {
            remoteAudio.play().then(() => remoteAudio.pause()).catch(() => {});
        }, { once: true });

        window.onload = init;
    </script>
</body>
</html>
